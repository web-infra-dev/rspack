name: nodejs and pnpm setup

description: Install Node.js and pnpm

inputs:
  node-version:
    default: '22'
    required: false
    type: string

runs:
  using: composite
  steps:
    - name: Install Node.js
      if: ${{ startsWith(runner.name, 'rspack-darwin-') }}
      uses: rstackjs/setup-node@3ff0cf4618911930967df3bf1afa93fda4abaf1b # v0.0.2
      with:
        registry-url: https://registry.npmmirror.com
        node-version: ${{ inputs.node-version }}

    - name: Install Node.js
      if: ${{ !startsWith(runner.name, 'rspack-darwin-') }}
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
      with:
        node-version: ${{ inputs.node-version }}

    - name: Install pnpm
      uses: pnpm/setup@731dfb6463bbd11c11fd0ee11fe00ed0e36d48a1 # v3.2.0
      with:
        node-version-file: false
        install: false
        # E2E containers mount the tool cache to access Node.js and pnpm.
        dest: ${{ runner.tool_cache }}/pnpm
