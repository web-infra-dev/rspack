name: nodejs and pnpm setup

description: Install Node.js and pnpm

inputs:
  node-version:
    default: '22'
    required: false
    type: string

runs:
  using: composite
  steps:
    - name: Install Node.js
      if: ${{ startsWith(runner.name, 'rspack-darwin-') }}
      uses: rstackjs/setup-node@3ff0cf4618911930967df3bf1afa93fda4abaf1b # v0.0.2
      with:
        registry-url: https://registry.npmmirror.com
        node-version: ${{ inputs.node-version }}

    - name: Install Node.js
      if: ${{ !startsWith(runner.name, 'rspack-darwin-') }}
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
      with:
        node-version: ${{ inputs.node-version }}

    # pnpm/action-setup's self-update cannot locate pnpm.exe on Windows.
    - name: Install pnpm on Windows
      if: runner.os == 'Windows'
      shell: bash
      run: |
        npm install --global --prefix "$RUNNER_TEMP/pnpm" "$(node -p "require('./package.json').packageManager")"
        cygpath -w "$RUNNER_TEMP/pnpm" >> "$GITHUB_PATH"

    - name: Install pnpm
      if: runner.os != 'Windows'
      uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      env:
        # Mirrors may omit platform packages required by pnpm's self-update.
        PNPM_CONFIG_REGISTRY: https://registry.npmjs.org
      with:
        # E2E containers mount the tool cache to access Node.js and pnpm.
        dest: ${{ runner.tool_cache }}/pnpm
