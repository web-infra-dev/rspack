# This action installs the minimal Rust profile and configures Swatinem/rust-cache.
#
# It is needed to install as few Rust components as possbile because
# it takes a few minutes to install some of components on Windows and Mac, especially rust-doc.

name: Rustup

description: Install Rust with cache

inputs:
  key:
    required: true
    type: string
  save-if:
    default: false
    required: false
    type: boolean

runs:
  using: composite
  steps:
    - name: Install rustup, if needed
      if: runner.os != 'Windows'
      shell: bash
      run: |
        # The macos-latest runner image ships Homebrew's `rustup-init` and
        # populates ~/.cargo/bin/{cargo,rustc,rustup,...} as symlinks pointing
        # back to it. `rustup-init` is only the installer — it doesn't proxy
        # `cargo`/`rustc`, so `cargo test` ends up in the installer's arg
        # parser and fails with "unexpected argument 'test'". A bare
        # `command -v rustup` passes because the symlink exists, leaving the
        # broken chain in place. Detect that exact case by resolving where
        # `rustup` points; if it lands on `rustup-init`, wipe the shim dir
        # so the official installer below can create real proxy binaries.
        # ~/.rustup/toolchains (the cached toolchain) is left untouched.
        rustup_bin=$(command -v rustup 2>/dev/null || true)
        if [ -n "$rustup_bin" ]; then
          resolved=$(readlink -f "$rustup_bin" 2>/dev/null || echo "$rustup_bin")
          case "$resolved" in
            */rustup-init)
              rm -rf "${CARGO_HOME:-$HOME/.cargo}/bin"
              ;;
          esac
        fi
        if ! command -v rustup &> /dev/null ; then
          curl --proto '=https' --tlsv1.2 --retry 10 --retry-connrefused -fsSL "https://sh.rustup.rs" | sh -s -- --default-toolchain none -y --no-modify-path
          echo "${CARGO_HOME:-$HOME/.cargo}/bin" >> $GITHUB_PATH
        fi

    - name: Get toolchain
      id: get-toolchain
      shell: bash
      run: |
        toolchain=$(grep -E "^channel\s*=" rust-toolchain.toml | sed -n -E 's/^[ \t]*channel[ \t]*=[ \t]*"([^"]*)"[^#]*.*$/\1/p' | tr -d '[:space:]')
        echo "toolchain=${toolchain}" >> $GITHUB_OUTPUT

    - name: Restore rustup cache
      id: restore
      if: ${{ inputs.save-if == 'true' && runner.os != 'Windows' }}
      uses: ./.github/actions/cache/restore
      with:
        path: ~/.rustup/toolchains
        key: rustup-cache-v4-${{ runner.os }}-${{ steps.get-toolchain.outputs.toolchain }}

    # install components for nightly toolchain
    - name: Install
      shell: bash
      run: |
        toolchain='${{ steps.get-toolchain.outputs.toolchain }}'
        rustup toolchain install $toolchain \
          -c rustc \
          -c cargo \
          -c rust-std \
          -c clippy \
          -c rustfmt

    - name: Save rustup cache
      uses: ./.github/actions/cache/save
      if: ${{ inputs.save-if == 'true' && steps.restore.outputs.cache-hit != 'true' && runner.os != 'Windows' }}
      with:
        path: ~/.rustup/toolchains
        key: rustup-cache-v4-${{ runner.os }}-${{ steps.get-toolchain.outputs.toolchain }}

    - name: Cargo cache
      uses: ./.github/actions/rustup/cargo
      with:
        key: ${{ inputs.key }}
        save-if: ${{ inputs.save-if == 'true' }}
