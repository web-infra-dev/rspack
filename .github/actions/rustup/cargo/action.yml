name: cargo cache

description: Cache rust dependencies to github or local

inputs:
  key:
    required: true
  save-if:
    default: false
    required: false
    type: boolean

runs:
  using: composite
  steps:
    - name: Cache to github
      if: ${{ runner.environment == 'github-hosted' }}
      uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      with:
        prefix-key: 'RCache-G-4'
        shared-key: ${{ inputs.key }}
        save-if: ${{ inputs.save-if }}
        cache-all-crates: 'true'
        cache-workspace-crates: 'true'

    - name: Cache to local
      uses: rstackjs/rust-cache@f16fdc0ddc74ba57dbaed86ec6afd85c995414fd # cache-workspace-crates
      if: ${{ runner.environment == 'self-hosted' }}
      with:
        prefix-key: 'RCache-L-7'
        shared-key: ${{ inputs.key }}
        save-if: ${{ inputs.save-if }}
        fullmatch-only: 'true'
        cache-all-crates: 'true'
        cache-workspace-crates: 'true'
