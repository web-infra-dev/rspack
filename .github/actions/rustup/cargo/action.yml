name: cargo cache

description: Cache rust dependencies to github or local

inputs:
  key:
    required: true
  save-if:
    default: false
    required: false
    type: boolean

runs:
  using: composite
  steps:
    - name: Cache to github
      if: ${{ runner.environment == 'github-hosted' }}
      uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      with:
        prefix-key: 'RCache-G-6'
        shared-key: ${{ inputs.key }}
        save-if: ${{ inputs.save-if }}
        cache-workspace-crates: 'true'
        cache-all-crates: 'true'

    - name: Setup sccache env
      if: ${{ runner.environment == 'self-hosted' }}
      shell: bash
      run: |
        echo "SCCACHE_S3_KEY_PREFIX=caches/${{ github.repository }}-sccache-V-1/${{ runner.os }}" >> "$GITHUB_ENV"

        # Force vergen's output to be idempotent to improve cache hit rate
        echo "VERGEN_IDEMPOTENT=1" >> "$GITHUB_ENV"

        if [[ "${{ runner.os }}" == "Windows" ]]; then
          # Windows: keep proc-macro DLLs and rmeta (single-thread frontend)
          # reproducible cross-pod
          echo "LINK=-Brepro" >> "$GITHUB_ENV"
          sed -i 's/-Zthreads=8/-Zthreads=1/' .cargo/config.toml
        else
          # On Windows RUSTC_WRAPPER points to the read-after-link shim
          # installed below; only other platforms use sccache directly.
          echo "RUSTC_WRAPPER=sccache" >> "$GITHUB_ENV"
        fi

    - name: Setup sccache
      if: ${{ runner.environment == 'self-hosted' }}
      uses: rstackjs/sccache-action@8ece41fd13fd5d944a38144ac9eb98a7455fe438 # v0.1.0

    # Workaround for a Windows race in which a freshly linked proc-macro DLL is
    # memory-mapped with zeroed pages when sccache's hashing read overlaps its
    # first load by rustc. It surfaces flakily as `LoadLibraryExW failed
    # (os error 998)`, `error[E0463]: can't find crate` for a just-built
    # proc-macro, or rustc ICEs in proc_macro::bridge. See:
    # https://crates.io/crates/read-after-link and rust-lang/rust#107595.
    # The wrapper reads each newly linked proc-macro/dylib once before cargo
    # can load it, and delegates the actual compile to sccache.
    - name: Setup read-after-link wrapper (Windows)
      if: ${{ runner.environment == 'self-hosted' && runner.os == 'Windows' }}
      shell: bash
      run: |
        set -euo pipefail

        # Persisted in CARGO_HOME on the self-hosted runner; install is a no-op
        # when the pinned version is already present.
        if ! command -v read-after-link >/dev/null 2>&1; then
          cargo install --locked --version 0.1.0 read-after-link
        fi

        # Point cargo straight at the wrapper; it delegates the actual rustc
        # call to sccache through READ_AFTER_LINK_WRAPPER. SCCACHE_PATH is
        # exported by the sccache action; normalize it to a native Windows path
        # for the wrapper's child process.
        #
        # Trade-off: the `cc` crate only forwards RUSTC_WRAPPER to C/C++
        # compiles when the wrapper's file name is sccache/cachepot/buildcache/
        # kache. Because this wrapper is named `read-after-link`, C/C++ built
        # via `cc` on this target (mimalloc and lz4) bypass sccache, while all
        # Rust compiles keep full sccache coverage. Accepted to avoid a renamed
        # wrapper shim; the two C libraries are small and rebuild without cache
        # only on a clean target directory.
        wrapper_path="$(cygpath -w "$(command -v read-after-link)")"
        real_sccache="$(cygpath -w "${SCCACHE_PATH:-sccache}")"

        echo "RUSTC_WRAPPER=$wrapper_path" >> "$GITHUB_ENV"
        echo "READ_AFTER_LINK_WRAPPER=$real_sccache" >> "$GITHUB_ENV"
        echo "Configured RUSTC_WRAPPER=$wrapper_path"
        echo "Configured READ_AFTER_LINK_WRAPPER=$real_sccache"

    - name: Reset sccache server
      if: ${{ runner.environment == 'self-hosted' }}
      shell: bash
      run: |
        "${SCCACHE_PATH:-sccache}" --stop-server || true
