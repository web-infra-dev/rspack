name: cache

description: Automatically save and restore cache to local or github

inputs:
  key:
    description: 'An explicit key for saving the cache'
    required: true
  path:
    description: 'A list of files, directories, and wildcard patterns to cache and restore'
    required: true

runs:
  using: composite
  steps:
    - name: Save cache to github
      if: ${{ runner.environment == 'github-hosted' }}
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
      with:
        key: ${{ inputs.key }}
        path: ${{ inputs.path }}
    - name: Save cache to local
      if: ${{ runner.environment == 'self-hosted' }}
      uses: lynx-infra/cache/save@3c8b52290f86bc0144a2ea7d695c8d63f4962791 # codex/refresh-action-archive
      with:
        key: ${{ inputs.key }}
        path: ${{ inputs.path }}
