name: Bench Rust

on:
  workflow_call:
    inputs:
      target:
        required: true
        type: string
      runner: # Runner labels
        required: true
        type: string
      measurement: # CodSpeed measurement mode: "simulation", "walltime", or "memory"
        required: false
        type: string
        default: 'simulation'
      bench_target: # Optional Cargo benchmark target to build and run
        required: false
        type: string
        default: ''
      bench_filter: # Optional Cargo benchmark name filter to run
        required: false
        type: string
        default: ''
      ref: # Git reference to checkout
        required: false
        type: string

env:
  # Since CI builds are more akin to from-scratch builds, incremental compilation adds unnecessary dependency-tracking and IO overhead, reducing caching effectiveness.
  # https://github.com/rust-lang/rust-analyzer/blob/25368d24308d6a94ffe8b99f0122bcf5a2175322/.github/workflows/ci.yaml#L11
  CARGO_INCREMENTAL: 0

permissions:
  issues: write

jobs:
  bench-rust:
    name: 'Bench Rust ${{ inputs.measurement }}'
    runs-on: ${{ fromJSON(inputs.runner) }}
    env:
      BENCH_MODE: ${{ inputs.measurement }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref }}
          clean: ${{ runner.environment == 'github-hosted' }}

      - name: Pnpm Setup
        timeout-minutes: 5
        uses: ./.github/actions/pnpm/setup

      - name: Prepare benchmark cases
        run: pnpm run bench:prepare

      - name: Install Rust Toolchain
        uses: ./.github/actions/rustup
        with:
          save-if: true
          key: rust-bench-${{ inputs.target }}

      - name: Install cargo-codspeed binary
        uses: taiki-e/install-action@16b05812d776ae1dfaabc8277e421fb6d2506419 # v2
        with:
          tool: cargo-codspeed@4.7.0

      - name: Setup Rust Target
        run: rustup target add ${{ inputs.target }}

      - name: Run Cargo codegen
        run: cargo codegen

      - name: Build benchmark (${{ inputs.measurement }})
        if: ${{ inputs.measurement != 'memory' }}
        run: |
          bench_args=()
          if [ -n "${{ inputs.bench_target }}" ]; then
            bench_args+=(--bench "${{ inputs.bench_target }}")
          else
            bench_args+=(--bench benches --bench rspack_sources)
          fi
          cargo codspeed build -m ${{ inputs.measurement }} --profile codspeed -p rspack_benchmark "${bench_args[@]}"

      - name: Build memory benchmark
        if: ${{ inputs.measurement == 'memory' }}
        run: cargo codspeed build -m memory --profile codspeed -p rspack_benchmark --bench memory

      - name: Prepare CodSpeed temporary directory
        run: mkdir -p "${RUNNER_TEMP}/codspeed-valgrind-tmp"

      - name: Run benchmark (simulation)
        if: ${{ inputs.measurement == 'simulation' }}
        uses: hardfist/action@750625725fb8def914579fc789c6249580c84a95
        timeout-minutes: 30
        env:
          TMPDIR: ${{ runner.temp }}/codspeed-valgrind-tmp
          CODSPEED_EXPERIMENTAL_FAIR_SCHED: true
          MIMALLOC_PURGE_DELAY: '-1'
          # Pin glibc string-function selection to the SSE2 baseline. Simulation
          # reports a pure instruction count, but glibc resolves memcpy/memmove/
          # memset via CPU-feature ifunc dispatch, so the same binary yields a
          # different instruction count on different runner CPUs (e.g. AVX512 vs
          # AVX2). That environmental drift (~2%) shows up as phantom regressions
          # on short, copy-heavy benches. Forcing one variant on every runner
          # removes the cross-runner variance.
          GLIBC_TUNABLES: glibc.cpu.hwcaps=-AVX512F,-AVX2,-AVX,-AVX_Fast_Unaligned_Load,-ERMS,-Prefer_ERMS,-SSE4_2,-SSSE3
        with:
          mode: simulation
          run: |
            if [ -n "${{ inputs.bench_target }}" ]; then
              bench_args=(--bench "${{ inputs.bench_target }}")
              if [ -n "${{ inputs.bench_filter }}" ]; then
                bench_args+=("${{ inputs.bench_filter }}")
              fi
              RSPACK_BENCHCASES_DIR=$PWD/.bench/rspack-benchcases cargo codspeed run "${bench_args[@]}"
            else
              pnpm run bench:rust
            fi
          token: ${{ secrets.CODSPEED_TOKEN }}
          runner-version: rev:2ca934f5a71e0299e0a3941a84ac3b242b3b63b6
          skip-hash-check-warning: true

      - name: Run benchmark (walltime)
        if: ${{ inputs.measurement == 'walltime' }}
        uses: hardfist/action@750625725fb8def914579fc789c6249580c84a95
        timeout-minutes: 30
        env:
          TMPDIR: ${{ runner.temp }}/codspeed-valgrind-tmp
          # self-hosted physical runner runs as root but does not export HOME;
          # the codspeed runner installer sources $HOME/.cargo/env
          HOME: /root
        with:
          mode: walltime
          run: |
            sync; echo 1 > /proc/sys/vm/drop_caches
            if [ -n "${{ inputs.bench_target }}" ]; then
              bench_args=(--bench "${{ inputs.bench_target }}")
              if [ -n "${{ inputs.bench_filter }}" ]; then
                bench_args+=("${{ inputs.bench_filter }}")
              fi
              RSPACK_BENCHCASES_DIR=$PWD/.bench/rspack-benchcases cargo codspeed run "${bench_args[@]}"
            else
              pnpm run bench:rust
            fi
          token: ${{ secrets.CODSPEED_TOKEN }}
          runner-version: rev:2ca934f5a71e0299e0a3941a84ac3b242b3b63b6
          skip-hash-check-warning: true

      - name: Run benchmark (memory)
        if: ${{ inputs.measurement == 'memory' }}
        uses: CodSpeedHQ/action@48820ecdc9112f8f10eab425853ccc461510c0dc # runner v5.3.1 adds physical RSS tracking
        timeout-minutes: 30
        env:
          RSPACK_BENCHCASES_DIR: ${{ github.workspace }}/.bench/rspack-benchcases
          BENCH_MODE: memory
        with:
          mode: memory
          experimental-memory-track-physical: true
          run: |
            if [ -n "${{ inputs.bench_filter }}" ]; then
              cargo codspeed run --bench memory "${{ inputs.bench_filter }}"
            else
              cargo codspeed run --bench memory
            fi
          token: ${{ secrets.CODSPEED_TOKEN }}

      - name: Capture bounded Allocative snapshots
        if: ${{ always() && inputs.measurement == 'memory' }}
        env:
          BENCH_MODE: memory
          RSPACK_BENCHCASES_DIR: ${{ github.workspace }}/.bench/rspack-benchcases
          RSPACK_ALLOCATIVE_DIR: ${{ runner.temp }}/rspack-allocative
          RSPACK_ALLOCATIVE_MAX_SNAPSHOTS: 3
          RSPACK_ALLOCATIVE_SNAPSHOT_MODULE_GRAPH: 1
        run: cargo bench --profile codspeed -p rspack_benchmark --bench memory --features rspack_benchmark/allocative -- --test

      - name: Summarize Allocative snapshots
        if: ${{ always() && inputs.measurement == 'memory' }}
        run: |
          mkdir -p "${RUNNER_TEMP}/rspack-memory-artifact"
          shopt -s nullglob
          snapshots=("${RUNNER_TEMP}/rspack-allocative/"*.allocative)
          if [ ${#snapshots[@]} -gt 0 ]; then
            python3 scripts/memory/allocative_summary.py "${snapshots[@]}" --output "${RUNNER_TEMP}/rspack-memory-artifact/allocative-summary.json"
            cp "${RUNNER_TEMP}/rspack-allocative/"*.coverage.json "${RUNNER_TEMP}/rspack-memory-artifact/" 2>/dev/null || true
          else
            printf '{"schema_version":1,"kind":"allocative-summary","snapshots":[]}\n' > "${RUNNER_TEMP}/rspack-memory-artifact/allocative-summary.json"
          fi

      - name: Upload memory summary
        if: ${{ always() && inputs.measurement == 'memory' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: rspack-memory-summary-${{ inputs.target }}
          path: ${{ runner.temp }}/rspack-memory-artifact
          if-no-files-found: ignore

      - name: Prepare Valgrind temporary files artifact
        if: ${{ always() && inputs.measurement == 'simulation' }}
        run: |
          mkdir -p "${RUNNER_TEMP}/codspeed-valgrind-tmp"
          {
            echo "TMPDIR=${RUNNER_TEMP}/codspeed-valgrind-tmp"
            echo
            find "${RUNNER_TEMP}/codspeed-valgrind-tmp" -mindepth 1 -maxdepth 2 -printf '%M %s %p\n' | sort
          } > "${RUNNER_TEMP}/codspeed-valgrind-tmp/MANIFEST.txt"

      - name: Upload Valgrind temporary files
        if: ${{ always() && inputs.measurement == 'simulation' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: codspeed-valgrind-tmp-${{ inputs.target }}
          path: ${{ runner.temp }}/codspeed-valgrind-tmp
          include-hidden-files: true
          if-no-files-found: ignore
          overwrite: true
