name: Worker Windows diagnostic
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  diagnose:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/download-artifact@65a9edc5881444af0b9093a5e628f2fe47ea3b2e
        with:
          name: bindings-x86_64-pc-windows-msvc
          path: crates/node_binding/
          run-id: 40662804136
          github-token: ${{ github.token }}
      - uses: ./.github/actions/pnpm/setup
        with:
          node-version: 22.23.4
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build:js
      - name: Configure postmortem dumps
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force diagnostics
          $key = 'HKLM:\SOFTWARE\Microsoft\Windows\Windows Error Reporting\LocalDumps\node.exe'
          New-Item -Path $key -Force
          New-ItemProperty -Path $key -Name DumpFolder -Value "$pwd/diagnostics" -PropertyType ExpandString -Force
          New-ItemProperty -Path $key -Name DumpType -Value 0 -PropertyType DWord -Force
          New-ItemProperty -Path $key -Name CustomDumpFlags -Value 0x1121 -PropertyType DWord -Force
          New-ItemProperty -Path $key -Name DumpCount -Value 10 -PropertyType DWord -Force
      - name: Repeat original child bootstrap without debugger
        run: node scripts/worker-windows-probe.mjs
      - name: Analyze crash dumps when debugger is available
        if: always()
        shell: pwsh
        run: |
          $cdb = Get-ChildItem 'C:/Program Files (x86)/Windows Kits' -Recurse -Filter cdb.exe -ErrorAction SilentlyContinue | Where-Object FullName -match 'x64' | Select-Object -First 1 -ExpandProperty FullName
          if ($cdb) {
            foreach ($dump in Get-ChildItem diagnostics -Recurse -Filter '*.dmp') {
              & $cdb -z $dump.FullName -c '.ecxr; r; kv; lm; ~* k; q' 2>&1 | Out-File "$($dump.FullName).txt"
            }
          }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: worker-windows-diagnostics
          path: diagnostics/
