name: Worker Windows diagnostic
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  diagnose:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/download-artifact@65a9edc5881444af0b9093a5e628f2fe47ea3b2e
        with:
          name: bindings-x86_64-pc-windows-msvc
          path: crates/node_binding/
          run-id: 40662804136
          github-token: ${{ github.token }}
      - uses: ./.github/actions/pnpm/setup
        with:
          node-version: 22.23.4
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build:js
      - name: Prepare ProcDump
        shell: pwsh
        run: |
          Invoke-WebRequest https://download.sysinternals.com/files/Procdump.zip -OutFile "$env:RUNNER_TEMP/procdump.zip"
          Expand-Archive "$env:RUNNER_TEMP/procdump.zip" "$env:RUNNER_TEMP/procdump"
          New-Item -ItemType Directory -Force diagnostics
          Get-ChildItem 'C:/Program Files (x86)/Windows Kits' -Recurse -Filter cdb.exe -ErrorAction SilentlyContinue | Select-Object FullName
      - name: Compare worker exit with parent preload
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $node = (Get-Command node).Source
          foreach ($preload in @('no', 'yes')) {
            foreach ($case in @(@('worker-errors', 'close'), @('worker-references', 'close'), @('worker-references', 'terminate'))) {
              for ($iteration = 1; $iteration -le 3; $iteration++) {
                $name = "$($case[0])-$($case[1])-$preload-$iteration"
                $dump = "diagnostics/$name"
                New-Item -ItemType Directory -Force $dump | Out-Null
                Write-Output "RUN $name"
                & "$env:RUNNER_TEMP/procdump/procdump64.exe" -accepteula -mm -e -x $dump $node --expose-gc scripts/worker-windows-probe.mjs $case[0] $case[1] $preload 2>&1 | Tee-Object -FilePath "diagnostics/$name.log"
                Write-Output "PROCDUMP_EXIT $LASTEXITCODE"
                if (Get-ChildItem $dump -Filter '*.dmp') { break }
              }
            }
          }
          exit 0
      - name: Analyze crash dumps when debugger is available
        if: always()
        shell: pwsh
        run: |
          $cdb = Get-ChildItem 'C:/Program Files (x86)/Windows Kits' -Recurse -Filter cdb.exe -ErrorAction SilentlyContinue | Where-Object FullName -match 'x64' | Select-Object -First 1 -ExpandProperty FullName
          if ($cdb) {
            foreach ($dump in Get-ChildItem diagnostics -Recurse -Filter '*.dmp') {
              & $cdb -z $dump.FullName -c '.ecxr; r; kv; lm; ~* k; q' 2>&1 | Out-File "$($dump.FullName).txt"
            }
          }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: worker-windows-diagnostics
          path: diagnostics/
