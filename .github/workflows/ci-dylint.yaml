name: CI-Dylint

on:
  pull_request:
    types: [opened, synchronize]
    paths:
      - '.github/workflows/ci-dylint.yaml'
      - '.github/actions/rustup/**'
      - 'crates/**'
      - 'linting/**'
      - 'Cargo.lock'
      - 'Cargo.toml'
      - 'rust-toolchain.toml'
  merge_group:
    types: [checks_requested]
  workflow_dispatch:
  push:
    branches:
      - main
      - release/2.3.0
      - v1.x
    paths:
      - '.github/workflows/ci-dylint.yaml'
      - '.github/actions/rustup/**'
      - 'crates/**'
      - 'linting/**'
      - 'Cargo.lock'
      - 'Cargo.toml'
      - 'rust-toolchain.toml'
    tags-ignore:
      - '**'

jobs:
  dylint:
    name: Dylint
    runs-on: ${{ fromJSON(vars.LINUX_SELF_HOSTED_RUNNER_LABELS || '"ubuntu-22.04"') }}
    env:
      DYLINT_RUSTFLAGS: '-D warnings'
      # Keep the lint driver aligned with the workspace compiler APIs.
      DYLINT_TOOLCHAIN: nightly-2026-11-13
      DYLINT_VERSION: 6.4.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Restore Dylint tool cache
        id: dylint-tool-cache
        uses: ./.github/actions/cache/restore
        with:
          path: |
            ~/.cargo/bin/cargo-dylint
            ~/.cargo/bin/dylint-link
          key: dylint-tool-cache-v1-${{ runner.os }}-${{ runner.arch }}-${{ env.DYLINT_VERSION }}-${{ env.DYLINT_TOOLCHAIN }}

      - name: Restore Dylint cache
        id: dylint-cache
        uses: ./.github/actions/cache/restore
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            ~/.cargo/git/checkouts/
            ~/.dylint_drivers/
            target/dylint/
          key: dylint-cache-v1-${{ runner.os }}-${{ runner.arch }}-${{ env.DYLINT_VERSION }}-${{ env.DYLINT_TOOLCHAIN }}-${{ hashFiles('rust-toolchain.toml', 'linting/**/Cargo.toml', 'linting/**/Cargo.lock', 'linting/**/.cargo/*.toml', 'linting/**/src/**/*.rs') }}
          restore-keys: |
            dylint-cache-v1-${{ runner.os }}-${{ runner.arch }}-${{ env.DYLINT_VERSION }}-${{ env.DYLINT_TOOLCHAIN }}-

      - name: Install Rust Toolchain
        uses: ./.github/actions/rustup
        with:
          save-if: true
          key: dylint

      - name: Run Cargo codegen
        run: cargo codegen

      - name: Install Dylint components
        run: rustup component add --toolchain "$DYLINT_TOOLCHAIN" rustc-dev llvm-tools-preview rust-src

      - uses: cargo-bins/cargo-binstall@81df5c23b0dc775b009efdfc9895c5965b7a4e40 # v1.26.1

      - name: Install cargo-dylint
        run: |
          # Build from source: the Linux prebuilt binaries require GLIBC 2.38+,
          # which is newer than the glibc available on older CI runners.
          # The binaries are restored from the tool cache above, so this only
          # compiles on a cache miss.
          install_dylint_tool() {
            local tool="$1"
            if command -v "$tool" >/dev/null 2>&1 && "$tool" --version 2>/dev/null | grep -Eq " ${DYLINT_VERSION}$"; then
              echo "$tool $DYLINT_VERSION is already installed"
            else
              cargo binstall --no-confirm --force --strategies compile "$tool@$DYLINT_VERSION"
            fi
          }
          install_dylint_tool cargo-dylint
          install_dylint_tool dylint-link

      - name: Save Dylint tool cache
        if: ${{ success() && steps.dylint-tool-cache.outputs.cache-hit != 'true' }}
        uses: ./.github/actions/cache/save
        with:
          path: |
            ~/.cargo/bin/cargo-dylint
            ~/.cargo/bin/dylint-link
          key: dylint-tool-cache-v1-${{ runner.os }}-${{ runner.arch }}-${{ env.DYLINT_VERSION }}-${{ env.DYLINT_TOOLCHAIN }}

      - name: Run dylint
        run: cargo dylint --all

      - name: Save Dylint cache
        if: ${{ success() && steps.dylint-cache.outputs.cache-hit != 'true' }}
        uses: ./.github/actions/cache/save
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            ~/.cargo/git/checkouts/
            ~/.dylint_drivers/
            target/dylint/
          key: dylint-cache-v1-${{ runner.os }}-${{ runner.arch }}-${{ env.DYLINT_VERSION }}-${{ env.DYLINT_TOOLCHAIN }}-${{ hashFiles('rust-toolchain.toml', 'linting/**/Cargo.toml', 'linting/**/Cargo.lock', 'linting/**/.cargo/*.toml', 'linting/**/src/**/*.rs') }}
