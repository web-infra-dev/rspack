name: CI-Lint

on:
  pull_request:
    types: [opened, synchronize]
  merge_group:
    types: [checks_requested]
  workflow_dispatch:
  push:
    branches:
      - main
      - v1.x
    tags-ignore:
      - '**'
jobs:
  lint:
    name: Lint and format
    runs-on: ${{ fromJSON(vars.CI_LINUX_MINI_RUNNER || '"ubuntu-latest"') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Pnpm Setup
        uses: ./.github/actions/pnpm/setup

      - name: Pnpm Install
        run: pnpm i

      - name: Run Rstack checks
        run: pnpm run lint:js

      - name: Website Spell Check
        run: pnpm --dir website run check:spell

      - name: Typos Check
        uses: crate-ci/typos@bee27e3a4fd1ea2111cf90ab89cd076c870fce14 # v1.48.0
        with:
          files: .

  vm-cancellation-target-pr:
    if: ${{ github.event_name == 'pull_request' && github.head_ref == 'p/deanjingshui/vm-debug' }}
    runs-on: rspack-ubuntu-24.04-vm-medium-verify
    timeout-minutes: 15
    steps:
      - name: Wait for CI-Lint run cancellation
        run: |
          set -euo pipefail
          test "$(systemd-detect-virt)" = kvm
          echo "VM_READY_FOR_CANCELLATION"
          sleep 600
