name: Verify mirror - official vs fork at node 22

# Experiment 2: with the real config (node 22) the official action + cnpm mirror still
# downloads Node from GitHub releases, because 22 is in the node-versions manifest and
# the mirror is only a fallback. The fork downloads from cnpm instead. This run passes;
# compare the "Acquiring ... from <url>" line in each setup step to see the real source.

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize]
    paths:
      - '.github/workflows/verify-mirror-node22.yml'

jobs:
  official-mirror-node22:
    name: official + cnpm mirror + node 22 (downloads from GitHub, not cnpm)
    runs-on: ${{ fromJSON(vars.MAC_SELF_HOSTED_RUNNER_LABELS || '"macos-latest"') }}
    steps:
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: '22'
          mirror: https://registry.npmmirror.com/-/binary/node
      - run: node -v && which node

  fork-node22:
    name: rstackjs/setup-node fork + node 22 (downloads from cnpm)
    runs-on: ${{ fromJSON(vars.MAC_SELF_HOSTED_RUNNER_LABELS || '"macos-latest"') }}
    steps:
      - uses: rstackjs/setup-node@cc72f1c242ef8813f650223fbae3c29d450ae29e # v0.0.1
        with:
          registry-url: https://registry.npmmirror.com
          node-version: '22'
      - run: node -v && which node
