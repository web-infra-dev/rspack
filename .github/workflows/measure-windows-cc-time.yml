# TEMPORARY measurement workflow.
#
# Purpose: quantify the cold (clean-target) compile time of the two C/C++
# libraries built through the `cc` crate on the Windows MSVC target:
#   - libmimalloc-sys  (mimalloc C sources, via rspack_allocator)
#   - lzzzz            (lz4 C sources, via rspack-turbo-persistence -> rspack_core)
#
# These are the only C builds that bypass sccache once RUSTC_WRAPPER points at
# `read-after-link` (the `cc` crate ignores wrappers not named sccache/...).
#
# This file is manual-dispatch only and is meant to be deleted before the
# accompanying PR is merged.
name: Measure Windows cc build time

on:
  workflow_dispatch:
    inputs:
      runs:
        description: "Cold (clean target) runs to average"
        required: true
        default: "3"

env:
  CARGO_INCREMENTAL: "0"

jobs:
  measure:
    name: Measure cc build-script time (x86_64-pc-windows-msvc)
    runs-on: ${{ vars.WINDOWS_SELF_HOSTED_RUNNER_LABELS || 'windows-latest' }}
    defaults:
      run:
        shell: bash
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Rust toolchain (timings + target only)
        shell: bash
        run: |
          set -euo pipefail
          # Honor rust-toolchain.toml (pinned nightly), then ensure the MSVC target.
          rustc --version
          cargo --version
          rustup target add x86_64-pc-windows-msvc

      - name: Cargo codegen
        run: cargo codegen

      - name: Measure cold cc build-script time
        id: measure
        env:
          RUNS: ${{ inputs.runs }}
          # Intentionally do NOT set RUSTC_WRAPPER: this measures the raw C
          # compile cost (what a sccache miss costs), not caching behavior.
        run: |
          set -euo pipefail
          mkdir -p timing-out

          # Locate the newest timings report; prefer JSON, fall back to the
          # HTML report (which embeds the same UNIT_DATA) on older cargo.
          newest_timing() {
            local json html
            json="$(ls -1t target/cargo-timings/cargo-timing-*.json 2>/dev/null | head -1 || true)"
            if [[ -n "$json" ]]; then echo "$json"; return; fi
            html="$(ls -1t target/cargo-timings/cargo-timing-*.html 2>/dev/null | head -1 || true)"
            echo "$html"
          }

          run_count="${RUNS:-3}"
          for i in $(seq 1 "$run_count"); do
            echo "::group::Cold run $i/$run_count (clean target)"
            # Clean only the target profile dir so registry/cache downloads are
            # reused; we want compile time, not network time.
            rm -rf target/x86_64-pc-windows-msvc/ci
            # Bash built-in timing (no /usr/bin/time dependency on Git Bash).
            start="$(date +%s.%N)"
            cargo build \
              --target x86_64-pc-windows-msvc \
              --profile ci \
              --timings=json \
              -p libmimalloc-sys -p lzzzz
            end="$(date +%s.%N)"
            awk "BEGIN{printf \"real %.2f\\n\", $end - $start}" \
              > "timing-out/wall-run-$i.txt"
            cat "timing-out/wall-run-$i.txt"
            cp "$(newest_timing)" "timing-out/timing-run-$i"
            echo "::endgroup::"
          done

          # One warm run to show the incremental/up-to-date cost (should be ~0).
          echo "::group::Warm run (up-to-date, no clean)"
          cargo build \
            --target x86_64-pc-windows-msvc \
            --profile ci \
            --timings=json \
            -p libmimalloc-sys -p lzzzz
          cp "$(newest_timing)" "timing-out/timing-warm"
          echo "::endgroup::"

      - name: Parse timings
        id: parse
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import glob, json, re, statistics

          TARGETS = ("libmimalloc-sys", "lzzzz")

          def load_units(path):
              text = open(path, "r", encoding="utf-8").read()
              if path.endswith((".json",)):
                  data = json.loads(text)
                  if isinstance(data, dict):
                      for key in ("targets", "units"):
                          if key in data:
                              return data[key]
                  if isinstance(data, list):
                      return data
                  raise SystemExit(f"unrecognized json schema in {path}: {list(data)}")
              # HTML report: parse the embedded `const UNIT_DATA = [ ... ];`.
              match = re.search(r"const UNIT_DATA = (\[.*?\]);", text, re.S)
              if not match:
                  raise SystemExit(f"UNIT_DATA not found in {path}")
              return json.loads(match.group(1))

          def is_build_script(unit):
              target = str(unit.get("target", ""))
              kind = unit.get("kind") or unit.get("target_kind") or ""
              if isinstance(kind, list):
                  kind = " ".join(map(str, kind))
              return "build-script" in (target + " " + str(kind))

          def extract(path):
              rows = {}
              for unit in load_units(path):
                  name = unit.get("name")
                  if name in TARGETS and is_build_script(unit):
                      rows[name] = float(unit.get("duration", 0.0))
              return rows

          cold_files = sorted(glob.glob("timing-out/timing-run-*"))
          if not cold_files:
              raise SystemExit("no timing reports found in timing-out/")
          per_pkg = {pkg: [] for pkg in TARGETS}
          print("### Per-run build-script (C compile) duration, seconds")
          print("| run | libmimalloc-sys (mimalloc) | lzzzz (lz4) | combined |")
          print("|---|---|---|---|")
          for idx, path in enumerate(cold_files, start=1):
              rows = extract(path)
              combined = 0.0
              cells = []
              for pkg in TARGETS:
                  val = rows.get(pkg)
                  per_pkg[pkg].append(val if val is not None else 0.0)
                  combined += per_pkg[pkg][-1]
                  cells.append("n/a" if val is None else f"{val:.2f}")
              print(f"| {idx} | {cells[0]} | {cells[1]} | {combined:.2f} |")

          print("\n### Aggregate over cold runs")
          means = []
          for pkg in TARGETS:
              vals = per_pkg[pkg]
              mean = statistics.mean(vals)
              med = statistics.median(vals)
              means.append(mean)
              print(f"- `{pkg}`: mean {mean:.2f}s, median {med:.2f}s, "
                    f"min {min(vals):.2f}s, max {max(vals):.2f}s (n={len(vals)})")
          print(f"- combined mean (both C libs): {sum(means):.2f}s per cold build")

          print("\n### Whole-command wall time (Rust deps + C, cold)")
          walls = []
          for path in sorted(glob.glob("timing-out/wall-run-*.txt")):
              for line in open(path):
                  if line.startswith("real "):
                      walls.append(float(line.split()[1]))
          if walls:
              print(f"- wall `cargo build` mean {statistics.mean(walls):.1f}s "
                    f"(min {min(walls):.1f}s, max {max(walls):.1f}s) across {len(walls)} runs")

          warm = glob.glob("timing-out/timing-warm*")
          if warm:
              rows = extract(warm[0])
              print(f"\n### Warm (up-to-date) run\n- combined build-script time: {sum(rows.values()):.2f}s "
                    "(expect ~0; incremental builds pay no C cost)")
          PY

      - name: Upload timing artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-cc-timings
          path: timing-out/
          if-no-files-found: warn
          retention-days: 14
