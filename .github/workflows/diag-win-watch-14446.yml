name: diag-win-watch-14446

# Diagnostic-only workflow for issue #14446 ("File watching stops after first
# change on Windows"). DO NOT MERGE. Reproduces the symptom on the project's
# Windows runner and contrasts it against linux/macos, while logging the exact
# path strings handed to the watcher on each re-arm cycle.

on:
  push:
    branches:
      - 'diag/win-watch-stops-14446'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  runner-labels:
    uses: ./.github/workflows/get-runner-labels.yml

  controlled:
    name: controlled-${{ matrix.name }}
    needs: runner-labels
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows
            labels: ${{ needs.runner-labels.outputs.WINDOWS_RUNNER_LABELS }}
          - name: linux
            labels: ${{ needs.runner-labels.outputs.LINUX_RUNNER_LABELS }}
          - name: macos
            labels: ${{ needs.runner-labels.outputs.MACOS_RUNNER_LABELS }}
    runs-on: ${{ fromJSON(matrix.labels) }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - name: Setup Node & pnpm
        uses: ./.github/actions/pnpm/setup
        with:
          node-version: '22'
      - name: install (@rspack/core@2.0.8 only)
        shell: bash
        working-directory: CLAUDE_14446_diag/controlled
        run: npm install --no-audit --no-fund
      - name: run watch probe
        shell: bash
        working-directory: CLAUDE_14446_diag/controlled
        run: |
          node watch-probe.mjs | tee probe-output.txt
          echo "### Controlled probe — ${{ matrix.name }}" >> "$GITHUB_STEP_SUMMARY"
          grep "VERDICT:" probe-output.txt >> "$GITHUB_STEP_SUMMARY" || true

  controlled-swc:
    name: controlled-swc-${{ matrix.name }}
    needs: runner-labels
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows
            labels: ${{ needs.runner-labels.outputs.WINDOWS_RUNNER_LABELS }}
          - name: linux
            labels: ${{ needs.runner-labels.outputs.LINUX_RUNNER_LABELS }}
    runs-on: ${{ fromJSON(matrix.labels) }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - name: Setup Node & pnpm
        uses: ./.github/actions/pnpm/setup
        with:
          node-version: '22'
      - name: install (@rspack/core@2.0.8 only)
        shell: bash
        working-directory: CLAUDE_14446_diag/controlled-swc
        run: npm install --no-audit --no-fund
      - name: run watch probe (swc-loader)
        shell: bash
        working-directory: CLAUDE_14446_diag/controlled-swc
        run: |
          node watch-probe.mjs | tee probe-output.txt
          echo "### Controlled-swc probe — ${{ matrix.name }}" >> "$GITHUB_STEP_SUMMARY"
          grep "VERDICT:" probe-output.txt >> "$GITHUB_STEP_SUMMARY" || true

  resolver-probe:
    name: resolver-probe-${{ matrix.name }}
    needs: runner-labels
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows
            labels: ${{ needs.runner-labels.outputs.WINDOWS_RUNNER_LABELS }}
          - name: linux
            labels: ${{ needs.runner-labels.outputs.LINUX_RUNNER_LABELS }}
    runs-on: ${{ fromJSON(matrix.labels) }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - name: Setup Rust
        uses: ./.github/actions/rustup
        with:
          key: diag-resolver-probe
      - name: run resolver probe
        shell: bash
        working-directory: CLAUDE_14446_diag/resolver-probe
        run: |
          cargo run --release 2>&1 | tee out.txt
          echo "### resolver-probe — ${{ matrix.name }}" >> "$GITHUB_STEP_SUMMARY"
          grep -E "mixed_sep|=>" out.txt >> "$GITHUB_STEP_SUMMARY" || true

  faithful:
    name: faithful-serve-${{ matrix.name }}
    needs: runner-labels
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows
            labels: ${{ needs.runner-labels.outputs.WINDOWS_RUNNER_LABELS }}
          - name: linux
            labels: ${{ needs.runner-labels.outputs.LINUX_RUNNER_LABELS }}
    runs-on: ${{ fromJSON(matrix.labels) }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - name: Setup Node & pnpm
        uses: ./.github/actions/pnpm/setup
        with:
          node-version: '22'
      - name: run faithful serve repro
        shell: bash
        run: bash CLAUDE_14446_diag/serve-repro.sh
