name: Linux LLD runtime benchmark

on:
  push:
    branches: [chenjiahan/linux-lld-ab]
  workflow_dispatch:
    inputs:
      commit:
        type: string
        required: false
        description: Unused compatibility input
      profile:
        type: choice
        required: true
        default: release
        options: [release]
        description: Release only
      target:
        type: choice
        required: true
        default: x86_64-unknown-linux-gnu
        options: [x86_64-unknown-linux-gnu]
        description: Native Linux target

permissions:
  contents: read
  actions: read

jobs:
  benchmark:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    env:
      CARGO_INCREMENTAL: 0
      PUPPETEER_SKIP_DOWNLOAD: 1
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: rspack-contrib/build-tools-performance
          ref: 7367c8ff45bb616ef5b07e0ac4de7e96ed93a761
          path: .linux-lld-btp
      - uses: ./.github/actions/pnpm/setup
        with:
          node-version: '24'
      - name: Download the measured release bindings
        uses: actions/download-artifact@65a9edc5881444af0b9093a5e628f2fe47ea3b2e
        with:
          name: linux-lld-results
          run-id: 44226295064
          github-token: ${{ github.token }}
          path: .linux-lld-results
      - name: Install baseline binding
        run: cp .linux-lld-results/variants/baseline.node crates/node_binding/rspack.linux-x64-gnu.node
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build matching JavaScript packages
        run: pnpm build:js
      - name: Install benchmark dependencies
        working-directory: .linux-lld-btp
        run: pnpm install --frozen-lockfile
      - name: Generate dashboard
        working-directory: .linux-lld-btp/cases/react-dashboard
        run: node generate.mjs
      - name: Run build-tools-performance A/A/B
        run: python3 scripts/experiments/linux-lld.py bench
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: linux-lld-runtime-results
          include-hidden-files: true
          path: |
            .linux-lld-results/*.json
            .linux-lld-results/*.log
            .linux-lld-results/*.time
