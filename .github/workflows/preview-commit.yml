name: Linux LLD CI profile experiment

on:
  push:
    branches: [chenjiahan/linux-lld-ab]
  workflow_dispatch:
    inputs:
      commit:
        type: string
        required: false
        description: Unused compatibility input
      profile:
        type: choice
        required: true
        default: release
        options: [release]
        description: Release only
      target:
        type: choice
        required: true
        default: x86_64-unknown-linux-gnu
        options: [x86_64-unknown-linux-gnu]
        description: Native Linux target

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ${{ fromJSON(vars.LINUX_SELF_HOSTED_RUNNER_LABELS || '"ubuntu-22.04"') }}
    timeout-minutes: 120
    env:
      CARGO_INCREMENTAL: 0
      LLD_AB_PROFILE: ci
      PUPPETEER_SKIP_DOWNLOAD: 1
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: rspack-contrib/build-tools-performance
          ref: 7367c8ff45bb616ef5b07e0ac4de7e96ed93a761
          path: .linux-lld-btp
      - uses: ./.github/actions/pnpm/setup
        with:
          node-version: '24'
      - uses: ./.github/actions/rustup
        with:
          key: linux-lld-experiment
          use-cache: false
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Generate Rust sources
        run: cargo codegen
      - name: Build CI variants and compare identical objects
        run: python3 scripts/experiments/linux-lld.py build
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: linux-lld-ci-results
          include-hidden-files: true
          path: |
            .linux-lld-results/*.json
            .linux-lld-results/*.log
            .linux-lld-results/*.time
