name: sccache-poc

# Goal: raise the second identical-commit build's sccache coverage above 95%.
# Single self-hosted job, local SCCACHE_DIR (no backend confound) so the number
# reflects pure determinism: build cold -> rm -rf target -> build warm. The warm
# hit rate is the coverage; SCCACHE_LOG=debug pinpoints crates that still miss.

on:
  push:
    branches: [ci-measure-cargo-cache-utilization]
  workflow_dispatch:

env:
  CARGO_INCREMENTAL: 0
  CARGO_TERM_COLOR: always

jobs:
  measure:
    name: sccache coverage (linux-gnu ci)
    runs-on: ${{ fromJSON(vars.LINUX_SELF_HOSTED_RUNNER_LABELS || '"ubuntu-22.04"') }}
    defaults:
      run:
        shell: bash
    env:
      RUSTC_WRAPPER: sccache
      SCCACHE_DIR: /tmp/sccache-cache
      SCCACHE_LOG: debug
      SCCACHE_ERROR_LOG: /tmp/sccache-server.log
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: ./.github/actions/pnpm/setup
      - name: Install Binding Dependencies
        run: |
          cd ./crates/node_binding
          pnpm i --ignore-workspace --no-lockfile
          cd ../../
      - name: Install Rust Toolchain
        uses: ./.github/actions/rustup
        with:
          key: sccache-poc
          save-if: false
          use-cache: false
      - run: rustup target add x86_64-unknown-linux-gnu
      - uses: mozilla/sccache-action@7d986dd989559c6ecdb630a3fd2557667be217ad # v0.0.9
      - run: cargo codegen
      - name: Trim paths
        run: |
          echo $'\n' >> .cargo/config.toml
          echo 'trim-paths = true' >> .cargo/config.toml

      - name: Build cold (populate sccache)
        env:
          RUST_TARGET: x86_64-unknown-linux-gnu
          USE_NAPI_CROSS: '1'
        run: pnpm build:binding:ci
      - run: sccache --show-stats

      - name: Reset for warm build
        run: |
          rm -rf target
          sccache --stop-server || true
          rm -f "$SCCACHE_ERROR_LOG"
          sccache --start-server
          sccache --zero-stats

      - name: Build warm (second identical-commit build)
        env:
          RUST_TARGET: x86_64-unknown-linux-gnu
          USE_NAPI_CROSS: '1'
        run: pnpm build:binding:ci

      - name: Warm stats + capture miss set
        run: |
          echo "### WARM ###"
          sccache --show-stats | grep -iE 'hits rate|Cache (hits|misses) +[0-9]'
          sccache --stop-server || true
          grep -i 'cache miss' "$SCCACHE_ERROR_LOG" \
            | grep -oE '\[[A-Za-z0-9_.-]+\]' | sort -u > /tmp/warm_miss.txt
          echo "warm unique miss outputs: $(wc -l < /tmp/warm_miss.txt)"

      - name: Reset for warm2 build
        run: |
          rm -rf target
          sccache --stop-server || true
          rm -f "$SCCACHE_ERROR_LOG"
          sccache --start-server
          sccache --zero-stats

      - name: Build warm2 (third identical-commit build)
        env:
          RUST_TARGET: x86_64-unknown-linux-gnu
          USE_NAPI_CROSS: '1'
        run: pnpm build:binding:ci

      - name: Warm2 stats + compare miss sets
        run: |
          echo "### WARM2 ###"
          sccache --show-stats | grep -iE 'hits rate|Cache (hits|misses) +[0-9]'
          sccache --stop-server || true
          grep -i 'cache miss' "$SCCACHE_ERROR_LOG" \
            | grep -oE '\[[A-Za-z0-9_.-]+\]' | sort -u > /tmp/warm2_miss.txt
          echo "warm2 unique miss outputs: $(wc -l < /tmp/warm2_miss.txt)"
          echo "=== miss in BOTH warm and warm2 (nondeterministic every build) ==="
          comm -12 /tmp/warm_miss.txt /tmp/warm2_miss.txt | head -80
          echo "=== miss in warm ONLY (cold-vs-warm one-time) ==="
          comm -23 /tmp/warm_miss.txt /tmp/warm2_miss.txt | head -40
