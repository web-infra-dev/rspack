name: sccache-poc

# Goal: raise the second identical-commit build's sccache coverage above 95%.
# Single self-hosted job, local SCCACHE_DIR (no backend confound) so the number
# reflects pure determinism: build cold -> rm -rf target -> build warm. The warm
# hit rate is the coverage; SCCACHE_LOG=debug pinpoints crates that still miss.

on:
  push:
    branches: [ci-measure-cargo-cache-utilization]
  workflow_dispatch:

env:
  CARGO_INCREMENTAL: 0
  CARGO_TERM_COLOR: always

jobs:
  measure:
    name: sccache coverage (linux-gnu ci)
    runs-on: ${{ fromJSON(vars.LINUX_SELF_HOSTED_RUNNER_LABELS || '"ubuntu-22.04"') }}
    defaults:
      run:
        shell: bash
    env:
      RUSTC_WRAPPER: sccache
      SCCACHE_DIR: /tmp/sccache-cache
      SCCACHE_LOG: debug
      SCCACHE_ERROR_LOG: /tmp/sccache-server.log
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: ./.github/actions/pnpm/setup
      - name: Install Binding Dependencies
        run: |
          cd ./crates/node_binding
          pnpm i --ignore-workspace --no-lockfile
          cd ../../
      - name: Install Rust Toolchain
        uses: ./.github/actions/rustup
        with:
          key: sccache-poc
          save-if: false
          use-cache: false
      - run: rustup target add x86_64-unknown-linux-gnu
      - uses: mozilla/sccache-action@7d986dd989559c6ecdb630a3fd2557667be217ad # v0.0.9
      - run: cargo codegen

      - name: Trim paths
        run: |
          echo $'\n' >> .cargo/config.toml
          echo 'trim-paths = true' >> .cargo/config.toml

      # Last unchecked input: the process ENV sccache hashes. Wrap rustc to dump swc_core's
      # full environment in two builds and diff -> reveals the non-deterministic env var.
      - name: Capture swc_core rustc env (cold vs warm)
        run: |
          cat > /tmp/wrap.sh <<'EOF'
          #!/usr/bin/env bash
          case " $* " in
            *" --crate-name swc_core "*) env | sort | grep -vE '^(_|SHLVL|OLDPWD)=' > "/tmp/env_${BUILDTAG}.txt" ;;
          esac
          exec "$@"
          EOF
          chmod +x /tmp/wrap.sh
          build() {
            export BUILDTAG="$1"; rm -rf target
            RUSTC_WRAPPER=/tmp/wrap.sh cargo build --profile ci -p rspack_node --no-default-features --features plugin,perfetto 2>/dev/null
          }
          build cold
          build warm
          echo "=== swc_core rustc ENV diff (cold vs warm) ==="
          if diff /tmp/env_cold.txt /tmp/env_warm.txt; then echo "ENV IDENTICAL"; else echo "ENV DIFFERS ^ <- root cause"; fi
