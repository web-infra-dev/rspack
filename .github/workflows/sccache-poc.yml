name: sccache-poc

# Goal: second identical-commit build cache coverage > 95%.
# Production-shaped two-layer cache: the target/fingerprint cache restores dependency
# artifacts as fresh (so swc_core/mimalloc etc. are NOT recompiled -> no cascade), and
# sccache serves the workspace crates that the fingerprint cache strips. Measured by:
# build1 (cold) -> clean ONLY workspace members (simulates the dep-cache restore) ->
# build2 -> sccache hit rate on build2 == second identical-commit coverage.

on:
  push:
    branches: [ci-measure-cargo-cache-utilization]
  workflow_dispatch:

env:
  CARGO_INCREMENTAL: 0
  CARGO_TERM_COLOR: always
  RUSTC_WRAPPER: sccache

jobs:
  linux:
    name: sccache coverage (linux-gnu ci)
    runs-on: ${{ fromJSON(vars.LINUX_SELF_HOSTED_RUNNER_LABELS || '"ubuntu-22.04"') }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: ./.github/actions/pnpm/setup
      - name: Install Binding Dependencies
        run: |
          cd ./crates/node_binding && pnpm i --ignore-workspace --no-lockfile && cd ../../
      - name: Install Rust Toolchain
        uses: ./.github/actions/rustup
        with:
          key: sccache-poc
          save-if: false
          use-cache: false
      - run: rustup target add x86_64-unknown-linux-gnu
      - uses: mozilla/sccache-action@7d986dd989559c6ecdb630a3fd2557667be217ad # v0.0.9
      - run: cargo codegen
      - name: Trim paths
        run: |
          echo $'\n' >> .cargo/config.toml
          echo 'trim-paths = true' >> .cargo/config.toml
      - name: Combined cache coverage (target deps fresh + sccache)
        run: bash .github/sccache-coverage.sh

  windows:
    name: sccache coverage (windows-msvc ci)
    runs-on: ${{ fromJSON(vars.WINDOWS_SELF_HOSTED_RUNNER_LABELS || '"windows-latest"') }}
    defaults:
      run:
        shell: bash
    env:
      CARGO_PROFILE_CI_DEBUG: 'false' # MSVC: no PDB so sccache can cache
      SCCACHE_LOG: debug
      SCCACHE_ERROR_LOG: ${{ github.workspace }}/sccache-server.log
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: ./.github/actions/pnpm/setup
      - name: Install Binding Dependencies
        run: |
          cd ./crates/node_binding && pnpm i --ignore-workspace --no-lockfile && cd ../../
      - name: Install Rust Toolchain
        uses: ./.github/actions/rustup
        with:
          key: sccache-poc
          save-if: false
          use-cache: false
      - run: rustup target add x86_64-pc-windows-msvc
      - uses: mozilla/sccache-action@7d986dd989559c6ecdb630a3fd2557667be217ad # v0.0.9
      - run: cargo codegen
      - name: Trim paths
        run: |
          echo $'\n' >> .cargo/config.toml
          echo 'trim-paths = true' >> .cargo/config.toml
      - name: Combined cache coverage (target deps fresh + sccache)
        run: bash .github/sccache-coverage.sh
