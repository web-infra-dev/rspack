name: sccache-poc

# PoC: prove sccache reuses compilation and measure its hit rate, without the
# org-blocked mozilla/sccache-action. One job builds the linux-gnu ci binding
# twice: build 1 (cold) populates sccache's local cache, then `rm -rf target`
# forces cargo to recompile everything, and build 2's rustc calls hit sccache.
# `--zero-stats` between builds isolates build 2's hit rate.

on:
  push:
    branches: [ci-measure-cargo-cache-utilization]
  workflow_dispatch:

env:
  CARGO_INCREMENTAL: 0
  CARGO_TERM_COLOR: always
  RUSTC_WRAPPER: sccache

jobs:
  build:
    name: sccache PoC (linux-gnu ci)
    runs-on: ubuntu-22.04
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Pnpm Setup
        uses: ./.github/actions/pnpm/setup

      - name: Install Binding Dependencies
        run: |
          cd ./crates/node_binding
          pnpm i --ignore-workspace --no-lockfile
          cd ../../

      - name: Install Rust Toolchain
        uses: ./.github/actions/rustup
        with:
          key: sccache-poc
          save-if: false
          use-cache: false

      - name: Setup Rust Target
        run: rustup target add x86_64-unknown-linux-gnu

      - name: Install sccache
        uses: taiki-e/install-action@25435dc8dd3baed7417e0c96d3fe89013a5b2e09 # v2
        with:
          tool: sccache

      - name: Run Cargo codegen
        run: cargo codegen

      - name: Free disk cache
        uses: xc2/free-disk-space@fbe203b3788f2bebe2c835a15925da303eaa5efe # v1.0.0
        with:
          tool-cache: false

      - name: Build 1 (cold, populate sccache)
        env:
          RUST_TARGET: x86_64-unknown-linux-gnu
        run: pnpm build:binding:ci

      - name: sccache stats after build 1 (cold)
        run: sccache --show-stats

      - name: Force cargo to recompile everything
        run: |
          rm -rf target
          sccache --zero-stats

      - name: Build 2 (sccache-served recompile)
        env:
          RUST_TARGET: x86_64-unknown-linux-gnu
        run: pnpm build:binding:ci

      - name: sccache stats after build 2 (hit rate)
        run: sccache --show-stats
