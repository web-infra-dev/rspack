name: sccache-poc

# Goal: raise the second identical-commit build's sccache coverage above 95%.
# Single self-hosted job, local SCCACHE_DIR (no backend confound) so the number
# reflects pure determinism: build cold -> rm -rf target -> build warm. The warm
# hit rate is the coverage; SCCACHE_LOG=debug pinpoints crates that still miss.

on:
  push:
    branches: [ci-measure-cargo-cache-utilization]
  workflow_dispatch:

env:
  CARGO_INCREMENTAL: 0
  CARGO_TERM_COLOR: always

jobs:
  measure:
    name: sccache coverage (linux-gnu ci)
    runs-on: ${{ fromJSON(vars.LINUX_SELF_HOSTED_RUNNER_LABELS || '"ubuntu-22.04"') }}
    defaults:
      run:
        shell: bash
    env:
      RUSTC_WRAPPER: sccache
      SCCACHE_DIR: /tmp/sccache-cache
      SCCACHE_LOG: debug
      SCCACHE_ERROR_LOG: /tmp/sccache-server.log
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: ./.github/actions/pnpm/setup
      - name: Install Binding Dependencies
        run: |
          cd ./crates/node_binding
          pnpm i --ignore-workspace --no-lockfile
          cd ../../
      - name: Install Rust Toolchain
        uses: ./.github/actions/rustup
        with:
          key: sccache-poc
          save-if: false
          use-cache: false
      - run: rustup target add x86_64-unknown-linux-gnu
      - uses: mozilla/sccache-action@7d986dd989559c6ecdb630a3fd2557667be217ad # v0.0.9
      - run: cargo codegen

      - name: Trim paths
        run: |
          echo $'\n' >> .cargo/config.toml
          echo 'trim-paths = true' >> .cargo/config.toml

      # Comprehensive args diff: capture every rustc command (plain, no sccache) across
      # two full builds, sorted by crate, and diff. Shows exactly which crate's args
      # change build-to-build (e.g. a --extern path whose metahash is nondeterministic).
      - name: Diff rustc commands across two full builds
        env:
          RUSTC_WRAPPER: ''
        run: |
          probe() {
            rm -rf target
            cargo build --profile ci -p rspack_node --no-default-features --features plugin,perfetto -v 2>&1 \
              | grep -oE 'rustc --crate-name [a-z0-9_]+ .*' \
              | sed -E 's#=/[^ ]*/(lib[a-z0-9_]+-[0-9a-f]+\.r(meta|lib))#=\1#g; s#/[^ ]*/(crates/[a-z0-9_/.]+)#\1#g; s#/[^ ]*/(registry/src/[^ ]+)#\1#g' \
              | sort > "$1.cmds"
          }
          probe /tmp/c1
          probe /tmp/c2
          echo "=== crates whose rustc command DIFFERS across builds ==="
          diff /tmp/c1.cmds /tmp/c2.cmds | grep -E '^<' \
            | grep -oE 'crate-name [a-z0-9_]+' | sort -u | head -60
          echo "=== sample diff (first differing lines) ==="
          diff /tmp/c1.cmds /tmp/c2.cmds | head -20
