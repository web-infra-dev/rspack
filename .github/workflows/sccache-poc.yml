name: sccache-poc

# PoC: measure sccache hit rate with the GitHub Actions Cache backend.
# Target/fingerprint cache is disabled so sccache is the only cache.
# Run twice: run A populates the GHA cache (cold, all miss), run B (re-run)
# should hit on unchanged crates -> high sccache hit rate across runs.

on:
  push:
    branches: [ci-measure-cargo-cache-utilization]
  workflow_dispatch:

env:
  CARGO_INCREMENTAL: 0
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: sccache PoC GHA (linux-gnu ci)
    runs-on: ubuntu-22.04
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Pnpm Setup
        uses: ./.github/actions/pnpm/setup

      - name: Install Binding Dependencies
        run: |
          cd ./crates/node_binding
          pnpm i --ignore-workspace --no-lockfile
          cd ../../

      - name: Install Rust Toolchain
        uses: ./.github/actions/rustup
        with:
          key: sccache-poc
          save-if: false
          use-cache: false # isolate: sccache is the only cache

      - name: Setup Rust Target
        run: rustup target add x86_64-unknown-linux-gnu

      - name: Run Cargo codegen
        run: cargo codegen

      - name: Free disk cache
        uses: xc2/free-disk-space@fbe203b3788f2bebe2c835a15925da303eaa5efe # v1.0.0
        with:
          tool-cache: false

      - name: Setup sccache (GHA backend)
        uses: mozilla/sccache-action@7d986dd989559c6ecdb630a3fd2557667be217ad # v0.0.9

      - name: Build binding (ci) with sccache
        env:
          RUST_TARGET: x86_64-unknown-linux-gnu
          RUSTC_WRAPPER: sccache
          SCCACHE_GHA_ENABLED: 'true'
        run: pnpm build:binding:ci

      - name: sccache stats
        run: sccache --show-stats
