name: sccache-poc

# Goal: raise the second identical-commit build's sccache coverage above 95%.
# Single self-hosted job, local SCCACHE_DIR (no backend confound) so the number
# reflects pure determinism: build cold -> rm -rf target -> build warm. The warm
# hit rate is the coverage; SCCACHE_LOG=debug pinpoints crates that still miss.

on:
  push:
    branches: [ci-measure-cargo-cache-utilization]
  workflow_dispatch:

env:
  CARGO_INCREMENTAL: 0
  CARGO_TERM_COLOR: always

jobs:
  measure:
    name: sccache coverage (linux-gnu ci)
    runs-on: ${{ fromJSON(vars.LINUX_SELF_HOSTED_RUNNER_LABELS || '"ubuntu-22.04"') }}
    defaults:
      run:
        shell: bash
    env:
      RUSTC_WRAPPER: sccache
      SCCACHE_DIR: /tmp/sccache-cache
      SCCACHE_LOG: debug
      SCCACHE_ERROR_LOG: /tmp/sccache-server.log
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: ./.github/actions/pnpm/setup
      - name: Install Binding Dependencies
        run: |
          cd ./crates/node_binding
          pnpm i --ignore-workspace --no-lockfile
          cd ../../
      - name: Install Rust Toolchain
        uses: ./.github/actions/rustup
        with:
          key: sccache-poc
          save-if: false
          use-cache: false
      - run: rustup target add x86_64-unknown-linux-gnu
      - uses: mozilla/sccache-action@7d986dd989559c6ecdb630a3fd2557667be217ad # v0.0.9
      - run: cargo codegen

      - name: Trim paths
        run: |
          echo $'\n' >> .cargo/config.toml
          echo 'trim-paths = true' >> .cargo/config.toml

      # sccache logs each crate's "Hash key" at debug. Capture the key map in cold and
      # warm full builds; crates whose key changes are the misses. Cross-referencing with
      # the dep graph (offline) pinpoints the cascade root (changed key, all deps stable).
      - name: Capture per-crate sccache hash keys (cold vs warm)
        run: |
          keys() {
            grep -oE '\[[a-z0-9_]+\]: Hash key: [0-9a-f]+' "$1" \
              | sed -E 's/\[([a-z0-9_]+)\]: Hash key: ([0-9a-f]+)/\1 \2/' | sort -u
          }
          rm -rf target
          sccache --stop-server || true; rm -f "$SCCACHE_ERROR_LOG"; sccache --start-server
          cargo build --profile ci -p rspack_node --no-default-features --features plugin,perfetto
          keys "$SCCACHE_ERROR_LOG" > /tmp/cold_keys.txt
          rm -rf target
          sccache --stop-server || true; rm -f "$SCCACHE_ERROR_LOG"; sccache --start-server; sccache --zero-stats
          cargo build --profile ci -p rspack_node --no-default-features --features plugin,perfetto
          keys "$SCCACHE_ERROR_LOG" > /tmp/warm_keys.txt
          echo "### WARM stats ###"; sccache --show-stats | grep -iE 'hits rate|Cache (hits|misses) +[0-9]'
          echo "=== crates whose Hash key CHANGED (cold->warm) = the misses ==="
          comm -23 <(cut -d' ' -f1 /tmp/cold_keys.txt|sort -u) <(join /tmp/cold_keys.txt /tmp/warm_keys.txt -o 1.1 -j 1 | sort -u) 2>/dev/null || true
          join -j1 <(sort /tmp/cold_keys.txt) <(sort /tmp/warm_keys.txt) 2>/dev/null \
            | awk '$2!=$3{print $1}' | sort -u > /tmp/changed.txt
          echo "changed-key crates ($(wc -l < /tmp/changed.txt)):"; cat /tmp/changed.txt
          echo "=== BASE64 of cold/warm/changed for offline analysis ==="
          echo "COLDKEYS_B64:$(base64 -w0 /tmp/cold_keys.txt)"
          echo "WARMKEYS_B64:$(base64 -w0 /tmp/warm_keys.txt)"
