name: sccache-poc

# Goal: raise the second identical-commit build's sccache coverage above 95%.
# Single self-hosted job, local SCCACHE_DIR (no backend confound) so the number
# reflects pure determinism: build cold -> rm -rf target -> build warm. The warm
# hit rate is the coverage; SCCACHE_LOG=debug pinpoints crates that still miss.

on:
  push:
    branches: [ci-measure-cargo-cache-utilization]
  workflow_dispatch:

env:
  CARGO_INCREMENTAL: 0
  CARGO_TERM_COLOR: always

jobs:
  measure:
    name: sccache coverage (linux-gnu ci)
    runs-on: ${{ fromJSON(vars.LINUX_SELF_HOSTED_RUNNER_LABELS || '"ubuntu-22.04"') }}
    defaults:
      run:
        shell: bash
    env:
      RUSTC_WRAPPER: sccache
      SCCACHE_DIR: /tmp/sccache-cache
      SCCACHE_LOG: debug
      SCCACHE_ERROR_LOG: /tmp/sccache-server.log
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: ./.github/actions/pnpm/setup
      - name: Install Binding Dependencies
        run: |
          cd ./crates/node_binding
          pnpm i --ignore-workspace --no-lockfile
          cd ../../
      - name: Install Rust Toolchain
        uses: ./.github/actions/rustup
        with:
          key: sccache-poc
          save-if: false
          use-cache: false
      - run: rustup target add x86_64-unknown-linux-gnu
      - uses: mozilla/sccache-action@7d986dd989559c6ecdb630a3fd2557667be217ad # v0.0.9
      - run: cargo codegen

      - name: Trim paths
        run: |
          echo $'\n' >> .cargo/config.toml
          echo 'trim-paths = true' >> .cargo/config.toml

      # Commands are identical yet workspace crates miss -> sccache key depends on
      # something beyond args. Build one tiny workspace crate twice with FULL trace and
      # dump its hash-key inputs so we can see exactly what differs cold vs warm.
      - name: Trace one workspace crate's sccache key
        env:
          SCCACHE_LOG: trace
        run: |
          run_build() {
            rm -rf target
            sccache --stop-server || true; rm -f "$SCCACHE_ERROR_LOG"; sccache --start-server
            cargo build --profile ci -p rspack_workspace 2>/dev/null
            cp "$SCCACHE_ERROR_LOG" "$1"
          }
          run_build /tmp/t1.log   # cold (store)
          run_build /tmp/t2.log   # warm (should hit; if miss, key changed)
          echo "=== rspack_workspace hit/miss cold vs warm ==="
          grep -iE 'rspack_workspace.*cache (hit|miss)' /tmp/t1.log | tail -2
          grep -iE 'rspack_workspace.*cache (hit|miss)' /tmp/t2.log | tail -2
          echo "=== trace lines around rspack_workspace hashing (warm) ==="
          grep -iE 'rspack_workspace|hash|digest|env|--extern|preprocessor' /tmp/t2.log \
            | grep -iv 'cache miss for|config' | head -60
