name: sccache-poc
on:
  push:
    branches: [ci-measure-cargo-cache-utilization]
  workflow_dispatch:
env:
  CARGO_INCREMENTAL: 0
jobs:
  build:
    name: sccache PoC (linux-gnu ci)
    runs-on: ubuntu-22.04
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - name: Pnpm Setup
        uses: ./.github/actions/pnpm/setup
      - name: Install Rust Toolchain
        uses: ./.github/actions/rustup
        with:
          key: sccache-poc
          save-if: false
          use-cache: false
      - name: Free disk cache
        uses: xc2/free-disk-space@fbe203b3788f2bebe2c835a15925da303eaa5efe # v1.0.0
        with:
          tool-cache: false
      - name: Setup sccache
        uses: mozilla/sccache-action@1583d6b38d7be47f593cb472781bbb21cab4321e # v0.0.10
      - run: echo done
