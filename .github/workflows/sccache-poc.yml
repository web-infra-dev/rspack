name: sccache-poc

# Goal: raise the second identical-commit build's sccache coverage above 95%.
# Single self-hosted job, local SCCACHE_DIR (no backend confound) so the number
# reflects pure determinism: build cold -> rm -rf target -> build warm. The warm
# hit rate is the coverage; SCCACHE_LOG=debug pinpoints crates that still miss.

on:
  push:
    branches: [ci-measure-cargo-cache-utilization]
  workflow_dispatch:

env:
  CARGO_INCREMENTAL: 0
  CARGO_TERM_COLOR: always

jobs:
  measure:
    name: sccache coverage (linux-gnu ci)
    runs-on: ${{ fromJSON(vars.LINUX_SELF_HOSTED_RUNNER_LABELS || '"ubuntu-22.04"') }}
    defaults:
      run:
        shell: bash
    env:
      RUSTC_WRAPPER: sccache
      SCCACHE_DIR: /tmp/sccache-cache
      SCCACHE_LOG: debug
      SCCACHE_ERROR_LOG: /tmp/sccache-server.log
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: ./.github/actions/pnpm/setup
      - name: Install Binding Dependencies
        run: |
          cd ./crates/node_binding
          pnpm i --ignore-workspace --no-lockfile
          cd ../../
      - name: Install Rust Toolchain
        uses: ./.github/actions/rustup
        with:
          key: sccache-poc
          save-if: false
          use-cache: false
      - run: rustup target add x86_64-unknown-linux-gnu
      - uses: mozilla/sccache-action@7d986dd989559c6ecdb630a3fd2557667be217ad # v0.0.9
      - run: cargo codegen

      - name: Trim paths
        run: |
          echo $'\n' >> .cargo/config.toml
          echo 'trim-paths = true' >> .cargo/config.toml

      # Find which crates are non-reproducible. Build the full binding TWICE WITHOUT
      # sccache (so each compile is fresh, not cache-restored), then diff the content
      # hash of every dep rmeta/rlib. Crates whose bytes differ are non-reproducible;
      # the lowest of them is the cascade root that poisons sccache keys.
      - name: Probe which deps are non-reproducible
        env:
          RUSTC_WRAPPER: ''
        run: |
          probe() {
            rm -rf target
            cargo build --profile ci -p rspack_node --no-default-features --features plugin,perfetto 2>/dev/null
            find target -path '*/ci/deps/*' \( -name '*.rmeta' -o -name '*.rlib' \) -exec sha256sum {} \; \
              | sed -E 's# .*/(lib[^/]+)$#  \1#' | sort -k2 > "$1.hashes"
          }
          probe /tmp/p1
          probe /tmp/p2
          echo "=== total dep artifacts: $(wc -l < /tmp/p1.hashes) ==="
          echo "=== NON-REPRODUCIBLE crates (bytes differ across identical builds) ==="
          diff /tmp/p1.hashes /tmp/p2.hashes | grep -E '^[<>]' \
            | awk '{print $3}' | sed -E 's/-[0-9a-f]+\.(rmeta|rlib)$//' | sort -u | head -80
          echo "=== count ==="
          diff /tmp/p1.hashes /tmp/p2.hashes | grep -E '^<' | wc -l
