name: sccache-poc

# Goal: raise the second identical-commit build's sccache coverage above 95%.
# Single self-hosted job, local SCCACHE_DIR (no backend confound) so the number
# reflects pure determinism: build cold -> rm -rf target -> build warm. The warm
# hit rate is the coverage; SCCACHE_LOG=debug pinpoints crates that still miss.

on:
  push:
    branches: [ci-measure-cargo-cache-utilization]
  workflow_dispatch:

env:
  CARGO_INCREMENTAL: 0
  CARGO_TERM_COLOR: always

jobs:
  measure:
    name: sccache coverage (linux-gnu ci)
    runs-on: ${{ fromJSON(vars.LINUX_SELF_HOSTED_RUNNER_LABELS || '"ubuntu-22.04"') }}
    defaults:
      run:
        shell: bash
    env:
      RUSTC_WRAPPER: sccache
      SCCACHE_DIR: /tmp/sccache-cache
      SCCACHE_LOG: debug
      SCCACHE_ERROR_LOG: /tmp/sccache-server.log
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: ./.github/actions/pnpm/setup
      - name: Install Binding Dependencies
        run: |
          cd ./crates/node_binding
          pnpm i --ignore-workspace --no-lockfile
          cd ../../
      - name: Install Rust Toolchain
        uses: ./.github/actions/rustup
        with:
          key: sccache-poc
          save-if: false
          use-cache: false
      - run: rustup target add x86_64-unknown-linux-gnu
      - uses: mozilla/sccache-action@7d986dd989559c6ecdb630a3fd2557667be217ad # v0.0.9
      - run: cargo codegen

      # Reproducibility probe: build the proc-macro crates twice (rm target between)
      # and diff the resulting dylibs. If a proc-macro .so differs byte-for-byte, every
      # crate using it gets a different --extern hash in sccache -> miss every build.
      - name: Probe proc-macro dylib reproducibility
        run: |
          set -x
          build_and_hash() {
            cargo build --profile ci \
              -p rspack_cacheable_macros -p rspack_macros \
              -p rspack_napi_macros -p rspack_binding_builder_macros 2>/dev/null
            find target -name 'lib*macros*.so' -exec sha256sum {} \; \
              | sed -E 's# .*/(lib[^/]+\.so)$#  \1#' | sort -k2
          }
          echo "=== build 1 dylib hashes ==="; build_and_hash > /tmp/h1.txt; cat /tmp/h1.txt
          rm -rf target
          echo "=== build 2 dylib hashes ==="; build_and_hash > /tmp/h2.txt; cat /tmp/h2.txt
          echo "=== DIFF (empty = reproducible) ==="
          diff /tmp/h1.txt /tmp/h2.txt && echo "REPRODUCIBLE" || echo "NON-REPRODUCIBLE -> root cause"
