name: sccache-poc

# Goal: raise the second identical-commit build's sccache coverage above 95%.
# Single self-hosted job, local SCCACHE_DIR (no backend confound) so the number
# reflects pure determinism: build cold -> rm -rf target -> build warm. The warm
# hit rate is the coverage; SCCACHE_LOG=debug pinpoints crates that still miss.

on:
  push:
    branches: [ci-measure-cargo-cache-utilization]
  workflow_dispatch:

env:
  CARGO_INCREMENTAL: 0
  CARGO_TERM_COLOR: always

jobs:
  measure:
    name: sccache coverage (linux-gnu ci)
    runs-on: ${{ fromJSON(vars.LINUX_SELF_HOSTED_RUNNER_LABELS || '"ubuntu-22.04"') }}
    defaults:
      run:
        shell: bash
    env:
      RUSTC_WRAPPER: sccache
      SCCACHE_DIR: /tmp/sccache-cache
      SCCACHE_LOG: debug
      SCCACHE_ERROR_LOG: /tmp/sccache-server.log
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: ./.github/actions/pnpm/setup
      - name: Install Binding Dependencies
        run: |
          cd ./crates/node_binding
          pnpm i --ignore-workspace --no-lockfile
          cd ../../
      - name: Install Rust Toolchain
        uses: ./.github/actions/rustup
        with:
          key: sccache-poc
          save-if: false
          use-cache: false
      - run: rustup target add x86_64-unknown-linux-gnu
      - uses: mozilla/sccache-action@7d986dd989559c6ecdb630a3fd2557667be217ad # v0.0.9
      - run: cargo codegen

      - name: Trim paths
        run: |
          echo $'\n' >> .cargo/config.toml
          echo 'trim-paths = true' >> .cargo/config.toml

      # Roots have identical args/env yet changing keys. sccache also hashes the crate's
      # SOURCE files (via --emit=dep-info), which include build-script-generated files in
      # OUT_DIR. Hash each root's OUT_DIR across two builds (no sccache) to catch a
      # non-deterministic generated file = the true root input.
      - name: Probe root crates' OUT_DIR reproducibility
        env:
          RUSTC_WRAPPER: ''
        run: |
          probe() {
            rm -rf target
            cargo build --profile ci -p rspack_node --no-default-features --features plugin,perfetto 2>/dev/null
            for c in libmimalloc_sys swc_core swc swc_plugin_runner; do
              for od in target/ci/build/${c}-*/out; do
                [ -d "$od" ] || continue
                find "$od" -type f -exec sha256sum {} \; \
                  | sed -E "s# .*/build/${c}-[0-9a-f]+/# ${c}/#" | sort
              done
            done > "$1"
          }
          probe /tmp/o1
          probe /tmp/o2
          echo "=== OUT_DIR diff (empty = reproducible) ==="
          if diff /tmp/o1 /tmp/o2; then echo "OUT_DIR REPRODUCIBLE"; else echo "OUT_DIR DIFFERS -> root input found ^"; fi
          echo "=== files present (cold) ==="
          sed -E 's/^[0-9a-f]+ +//' /tmp/o1 | sort -u | head -40
