name: sccache-poc

# Goal: raise the second identical-commit build's sccache coverage above 95%.
# Single self-hosted job, local SCCACHE_DIR (no backend confound) so the number
# reflects pure determinism: build cold -> rm -rf target -> build warm. The warm
# hit rate is the coverage; SCCACHE_LOG=debug pinpoints crates that still miss.

on:
  push:
    branches: [ci-measure-cargo-cache-utilization]
  workflow_dispatch:

env:
  CARGO_INCREMENTAL: 0
  CARGO_TERM_COLOR: always

jobs:
  measure:
    name: sccache coverage (linux-gnu ci)
    runs-on: ${{ fromJSON(vars.LINUX_SELF_HOSTED_RUNNER_LABELS || '"ubuntu-22.04"') }}
    defaults:
      run:
        shell: bash
    env:
      RUSTC_WRAPPER: sccache
      SCCACHE_DIR: /tmp/sccache-cache
      SCCACHE_LOG: debug
      SCCACHE_ERROR_LOG: /tmp/sccache-server.log
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: ./.github/actions/pnpm/setup
      - name: Install Binding Dependencies
        run: |
          cd ./crates/node_binding
          pnpm i --ignore-workspace --no-lockfile
          cd ../../
      - name: Install Rust Toolchain
        uses: ./.github/actions/rustup
        with:
          key: sccache-poc
          save-if: false
          use-cache: false
      - run: rustup target add x86_64-unknown-linux-gnu
      - uses: mozilla/sccache-action@7d986dd989559c6ecdb630a3fd2557667be217ad # v0.0.9
      - run: cargo codegen

      # Why does rspack_cacheable miss every build? Capture its rustc command line in
      # two builds and diff. Command differs -> an arg varies; command identical ->
      # input content varies. Also diff its compiled rmeta to see if output is stable.
      - name: Probe rspack_cacheable rustc command + output reproducibility
        run: |
          probe() {
            rm -rf target
            cargo build --profile ci -p rspack_cacheable -v 2>&1 \
              | grep -oE 'rustc --crate-name rspack_cacheable .*' | head -1 \
              | tr ' ' '\n' > "$1.cmd" || true
            find target -path '*/deps/librspack_cacheable-*.rmeta' \
              -exec sha256sum {} \; | awk '{print $1}' | sort > "$1.out"
          }
          probe /tmp/b1
          probe /tmp/b2
          echo "=== rmeta output diff (empty = reproducible) ==="
          if diff /tmp/b1.out /tmp/b2.out; then echo "RMETA REPRODUCIBLE"; else echo "RMETA DIFFERS -> nondeterministic output"; fi
          echo "b1 rmeta: $(cat /tmp/b1.out)"
          echo "b2 rmeta: $(cat /tmp/b2.out)"
          echo "=== CMD diff (empty = identical args) ==="
          if diff /tmp/b1.cmd /tmp/b2.cmd; then echo "ARGS IDENTICAL"; else echo "ARGS DIFFER ^"; fi
          echo "=== rustc args sample (b1) ==="
          cat /tmp/b1.cmd
