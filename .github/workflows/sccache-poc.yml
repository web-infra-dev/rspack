name: sccache-poc

# PoC: measure sccache (GitHub Actions Cache backend) hit rate on the linux-gnu
# ci binding build. Target/fingerprint cache is disabled here so sccache is the
# only cache, giving a clean signal. Run twice: run A populates the GHA cache,
# run B (re-run) should show high hits on unchanged crates.

on:
  push:
    branches: [ci-measure-cargo-cache-utilization]
  workflow_dispatch:

env:
  CARGO_INCREMENTAL: 0
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: sccache PoC (linux-gnu ci)
    runs-on: ${{ fromJSON(vars.LINUX_SELF_HOSTED_RUNNER_LABELS || '"ubuntu-22.04"') }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Pnpm Setup
        uses: ./.github/actions/pnpm/setup

      - name: Install Binding Dependencies
        run: |
          cd ./crates/node_binding
          pnpm i --ignore-workspace --no-lockfile
          cd ../../

      - name: Install Rust Toolchain
        uses: ./.github/actions/rustup
        with:
          key: sccache-poc
          save-if: false
          use-cache: false # isolate: sccache is the only cache

      - name: Setup Rust Target
        run: rustup target add x86_64-unknown-linux-gnu

      - name: Run Cargo codegen
        run: cargo codegen

      - name: Setup sccache
        uses: mozilla/sccache-action@1583d6b38d7be47f593cb472781bbb21cab4321e # v0.0.10

      - name: Build binding (ci) with sccache
        env:
          RUST_TARGET: x86_64-unknown-linux-gnu
          RUSTC_WRAPPER: sccache
          SCCACHE_GHA_ENABLED: 'true'
        run: pnpm build:binding:ci

      - name: sccache stats
        run: sccache --show-stats
