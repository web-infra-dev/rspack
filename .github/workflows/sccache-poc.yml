name: sccache-poc

# Goal: raise the second identical-commit build's sccache coverage above 95%.
# Single self-hosted job, local SCCACHE_DIR (no backend confound) so the number
# reflects pure determinism: build cold -> rm -rf target -> build warm. The warm
# hit rate is the coverage; SCCACHE_LOG=debug pinpoints crates that still miss.

on:
  push:
    branches: [ci-measure-cargo-cache-utilization]
  workflow_dispatch:

env:
  CARGO_INCREMENTAL: 0
  CARGO_TERM_COLOR: always

jobs:
  measure:
    name: sccache coverage (linux-gnu ci)
    runs-on: ${{ fromJSON(vars.LINUX_SELF_HOSTED_RUNNER_LABELS || '"ubuntu-22.04"') }}
    defaults:
      run:
        shell: bash
    env:
      RUSTC_WRAPPER: sccache
      SCCACHE_DIR: /tmp/sccache-cache
      SCCACHE_LOG: debug
      SCCACHE_ERROR_LOG: /tmp/sccache-server.log
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: ./.github/actions/pnpm/setup
      - name: Install Binding Dependencies
        run: |
          cd ./crates/node_binding
          pnpm i --ignore-workspace --no-lockfile
          cd ../../
      - name: Install Rust Toolchain
        uses: ./.github/actions/rustup
        with:
          key: sccache-poc
          save-if: false
          use-cache: false
      - run: rustup target add x86_64-unknown-linux-gnu
      - uses: mozilla/sccache-action@7d986dd989559c6ecdb630a3fd2557667be217ad # v0.0.9
      - run: cargo codegen

      - name: Trim paths
        run: |
          echo $'\n' >> .cargo/config.toml
          echo 'trim-paths = true' >> .cargo/config.toml

      # Cascade roots are libmimalloc_sys + swc/swc_core/swc_plugin_runner. Capture the
      # exact sccache args (get_cached_or_compile) for them in cold vs warm, plus the
      # build-script-emitted rustc-env/cfg, to find the non-deterministic INPUT.
      - name: Probe root crates' args + build-script env
        run: |
          ROOTS='libmimalloc_sys|swc_core|swc_plugin_runner|swc[^_]'
          capture() {
            rm -rf target
            sccache --stop-server || true; rm -f "$SCCACHE_ERROR_LOG"; sccache --start-server
            cargo build --profile ci -p rspack_node --no-default-features --features plugin,perfetto -v 2>"$1.cargov" >/dev/null
            grep -oE '\[(libmimalloc_sys|swc_core|swc_plugin_runner|swc)\]: get_cached_or_compile: \[.*\]' "$SCCACHE_ERROR_LOG" | sort > "$1.args"
            # build-script-emitted rustc-env / rustc-cfg for the roots
            grep -E 'cargo::?rustc-(env|cfg)' "$1.cargov" | grep -iE 'mimalloc|swc' | sort -u > "$1.bsenv" || true
          }
          capture /tmp/c
          capture /tmp/w
          echo "=== ARGS diff for root crates (cold vs warm) ==="
          diff /tmp/c.args /tmp/w.args && echo "ROOT ARGS IDENTICAL" || echo "ROOT ARGS DIFFER ^"
          echo "=== build-script rustc-env/cfg diff ==="
          diff /tmp/c.bsenv /tmp/w.bsenv && echo "BUILD-SCRIPT ENV IDENTICAL" || echo "BUILD-SCRIPT ENV DIFFERS ^"
          echo "=== libmimalloc_sys full args (cold) ==="
          grep 'libmimalloc_sys' /tmp/c.args | head -1 | tr ',' '\n' | grep -iE 'env|cfg|extern|metadata|out-dir|L ' | head -30
