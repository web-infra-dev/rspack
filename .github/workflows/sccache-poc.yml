name: sccache-poc

# Goal: raise the second identical-commit build's sccache coverage above 95%.
# One run, two jobs on a self-hosted Linux runner:
#   cold  -> builds the linux-gnu ci binding, populating the sccache GHA cache.
#   warm  -> needs(cold), rebuilds the same commit; its sccache hit rate IS the
#            "second identical-commit build" coverage. SCCACHE_LOG=debug captures
#            which crates still miss so we can drive them down.

on:
  push:
    branches: [ci-measure-cargo-cache-utilization]
  workflow_dispatch:

env:
  CARGO_INCREMENTAL: 0
  CARGO_TERM_COLOR: always

jobs:
  cold:
    name: cold (populate sccache)
    runs-on: ${{ fromJSON(vars.LINUX_SELF_HOSTED_RUNNER_LABELS || '"ubuntu-22.04"') }}
    defaults:
      run:
        shell: bash
    env:
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: 'true'
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: ./.github/actions/pnpm/setup
      - name: Install Binding Dependencies
        run: |
          cd ./crates/node_binding
          pnpm i --ignore-workspace --no-lockfile
          cd ../../
      - name: Install Rust Toolchain
        uses: ./.github/actions/rustup
        with:
          key: sccache-poc
          save-if: false
          use-cache: false
      - run: rustup target add x86_64-unknown-linux-gnu
      - uses: mozilla/sccache-action@7d986dd989559c6ecdb630a3fd2557667be217ad # v0.0.9
      - run: cargo codegen
      - name: Trim paths
        run: |
          echo $'\n' >> .cargo/config.toml
          echo 'trim-paths = true' >> .cargo/config.toml
      - name: Build (cold)
        env:
          RUST_TARGET: x86_64-unknown-linux-gnu
          USE_NAPI_CROSS: '1'
        run: pnpm build:binding:ci
      - run: sccache --show-stats

  warm:
    name: warm (measure coverage)
    needs: cold
    runs-on: ${{ fromJSON(vars.LINUX_SELF_HOSTED_RUNNER_LABELS || '"ubuntu-22.04"') }}
    defaults:
      run:
        shell: bash
    env:
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: 'true'
      SCCACHE_LOG: debug
      SCCACHE_ERROR_LOG: ${{ runner.temp }}/sccache-server.log
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: ./.github/actions/pnpm/setup
      - name: Install Binding Dependencies
        run: |
          cd ./crates/node_binding
          pnpm i --ignore-workspace --no-lockfile
          cd ../../
      - name: Install Rust Toolchain
        uses: ./.github/actions/rustup
        with:
          key: sccache-poc
          save-if: false
          use-cache: false
      - run: rustup target add x86_64-unknown-linux-gnu
      - uses: mozilla/sccache-action@7d986dd989559c6ecdb630a3fd2557667be217ad # v0.0.9
      - run: cargo codegen
      - name: Trim paths
        run: |
          echo $'\n' >> .cargo/config.toml
          echo 'trim-paths = true' >> .cargo/config.toml
      - name: Build (warm = second identical-commit build)
        env:
          RUST_TARGET: x86_64-unknown-linux-gnu
          USE_NAPI_CROSS: '1'
        run: pnpm build:binding:ci
      - name: Coverage + miss breakdown
        run: |
          sccache --show-stats
          sccache --stop-server || true
          echo "=== top MISS outputs (crate-level) ==="
          grep -iE 'cache miss' "$SCCACHE_ERROR_LOG" 2>/dev/null \
            | grep -oE '\[[^]]*\]' | sort | uniq -c | sort -rn | head -80 \
            || echo "(no miss lines in $SCCACHE_ERROR_LOG)"
