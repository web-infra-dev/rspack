name: Diagnose Windows worker shutdown

on:
  push:
    branches: [fix/windows-worker-shutdown]

permissions:
  contents: read
  actions: read

jobs:
  diagnose:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: true
      PUPPETEER_SKIP_DOWNLOAD: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 8de69903003a8f660745b7500ae5621d2522a6fe
      - uses: actions/download-artifact@65a9edc5881444af0b9093a5e628f2fe47ea3b2e
        with:
          name: bindings-x86_64-pc-windows-msvc
          run-id: 40049744365
          github-token: ${{ github.token }}
          path: crates/node_binding/
      - uses: ./.github/actions/pnpm/setup
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build:js
      - name: Compare worker-only loading with parent retention
        shell: bash
        run: |
          cat > worker-shutdown-probe.mjs <<'JS'
          import { spawnSync } from 'node:child_process';
          import { writeFileSync } from 'node:fs';
          const source = `
            if (process.argv[1] === 'retain') {
              await import('./packages/rspack/dist/index.js');
              if (!process.report.getReport().sharedObjects.some(p => p.includes('rspack') && p.endsWith('.node'))) {
                throw new Error('Parent did not load the Rspack native binding');
              }
            }
            const { default: run } = await import('./tests/rspack-test/compilerCases/shared-accessors/workers.mjs');
            await run();
            console.log('workers exited');
            await new Promise(resolve => setTimeout(resolve, 500));
            console.log(JSON.stringify(process.report.getReport().sharedObjects.filter(p => p.endsWith('.node'))));
          `;
          const results = [];
          for (let round = 0; round < 100; round++) {
            for (const mode of round % 2 ? ['retain', 'baseline'] : ['baseline', 'retain']) {
              const result = spawnSync(process.execPath,
                ['--expose-gc', '--input-type=module', '--eval', source, mode],
                { encoding: 'utf8', timeout: 30000 });
              const row = { round, mode, status: result.status, signal: result.signal,
                error: result.error?.message, stdout: result.stdout, stderr: result.stderr };
              results.push(row);
              console.log(JSON.stringify(row));
            }
          }
          writeFileSync('worker-shutdown-results.json', JSON.stringify(results, null, 2));
          if (results.some(row => row.error || row.signal || ![0, 3221225477].includes(row.status))) {
            throw new Error('Diagnostic failed for a reason other than the target access violation');
          }
          JS
          node worker-shutdown-probe.mjs
      - name: Exercise worker exit under concurrent load
        shell: bash
        run: |
          cat > worker-shutdown-stress.mjs <<'JS'
          import { spawn } from 'node:child_process';
          import { writeFileSync } from 'node:fs';
          const source = `
            if (process.argv[1] === 'retain') await import('./packages/rspack/dist/index.js');
            const { default: run } = await import('./tests/rspack-test/compilerCases/shared-accessors/workers.mjs');
            await run();
            console.log('workers exited');
          `;
          const results = [];
          async function trial(round, mode) {
            const row = await new Promise(resolve => {
              const child = spawn(process.execPath,
                ['--expose-gc', '--input-type=module', '--eval', source, mode],
                { stdio: ['ignore', 'pipe', 'pipe'] });
              let stdout = '', stderr = '', error;
              const timeout = setTimeout(() => { error = 'timeout'; child.kill(); }, 30000);
              child.stdout.on('data', chunk => { stdout += chunk; });
              child.stderr.on('data', chunk => { stderr += chunk; });
              child.on('error', value => { error = value.message; });
              child.on('close', (status, signal) => {
                clearTimeout(timeout);
                resolve({ round, mode, status, signal, stdout, stderr, error });
              });
            });
            results.push(row);
            console.log(JSON.stringify(row));
          }
          for (let round = 0; round < 50; round++) {
            await Promise.all(['baseline', 'retain', 'baseline', 'retain'].map(mode => trial(round, mode)));
          }
          writeFileSync('worker-shutdown-stress-results.json', JSON.stringify(results, null, 2));
          if (results.some(row => row.error || row.signal || ![0, 3221225477].includes(row.status))) {
            throw new Error('Stress diagnostic failed for a reason other than the target access violation');
          }
          JS
          node worker-shutdown-stress.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: worker-shutdown-diagnosis
          path: worker-shutdown*-results.json
