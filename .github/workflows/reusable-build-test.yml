name: Run Test

on:
  workflow_call:
    inputs:
      target:
        required: true
        type: string
      runner: # Runner labels
        required: true
        type: string
      ref: # Git reference to checkout
        required: false
        type: string

jobs:
  e2e:
    name: E2E Testing
    if: inputs.target == 'x86_64-unknown-linux-gnu' || inputs.target == 'wasm32-wasip1-threads'
    runs-on: ${{ fromJSON(inputs.runner) }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Print fd usage at CI start
        if: inputs.target == 'wasm32-wasip1-threads'
        run: |
          print_fd_usage() {
            local label="$1"

            echo "::group::fd usage (${label})"
            echo "process fd soft limit: $(ulimit -Sn)"
            echo "process fd hard limit: $(ulimit -Hn)"
            if [[ -r /proc/sys/fs/file-max ]]; then
              echo "system fd max: $(cat /proc/sys/fs/file-max)"
            fi
            if [[ -r /proc/sys/fs/file-nr ]]; then
              read -r system_fd_allocated system_fd_unused system_fd_max < /proc/sys/fs/file-nr
              echo "system fd allocated=${system_fd_allocated} unused=${system_fd_unused} max=${system_fd_max}"
            fi
            if [[ -d /proc/self/fd ]]; then
              echo "current process fd count: $(find /proc/self/fd -mindepth 1 -maxdepth 1 2>/dev/null | wc -l)"
            fi
            echo "::endgroup::"
          }

          print_fd_usage "ci start"

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ inputs.ref }}
          clean: ${{ runner.environment == 'github-hosted' }}

      - name: Download bindings
        uses: ./.github/actions/artifact/download
        with:
          name: bindings-${{ inputs.target }}
          path: crates/node_binding/

      - name: Setup Pnpm
        timeout-minutes: 5
        uses: ./.github/actions/pnpm/setup
        with:
          node-version: 22

      - name: Pnpm Install
        run: pnpm i

      - name: Calculate Node Bin Path
        id: calculate-node-bin-path
        run: |
          NODE_BIN_PATH=$(dirname $(which node))
          echo "path=$NODE_BIN_PATH" >> $GITHUB_OUTPUT

      - name: Run e2e
        uses: ./.github/actions/docker/run
        if: inputs.target == 'x86_64-unknown-linux-gnu'
        with:
          # Jammy uses ubuntu 22.04
          # If this is to change, make sure to upgrade the ubuntu version in GitHub Actions
          image: mcr.microsoft.com/playwright:v1.59.1-jammy
          # .cache is required by download artifact, and mount in ./.github/actions/docker/run
          # .tool_cache is required by pnpm
          options: -v ${{ runner.tool_cache }}:${{runner.tool_cache}}
          script: |
            export PATH=${{ steps.calculate-node-bin-path.outputs.path }}:$PATH
            pnpm run build:js
            pnpm run test:e2e

      - name: Run e2e for @rspack/browser
        uses: ./.github/actions/docker/run
        if: inputs.target == 'wasm32-wasip1-threads'
        with:
          # Jammy uses ubuntu 22.04
          # If this is to change, make sure to upgrade the ubuntu version in GitHub Actions
          image: mcr.microsoft.com/playwright:v1.59.1-jammy
          # .cache is required by download artifact, and mount in ./.github/actions/docker/run
          # .tool_cache is required by pnpm
          options: -v ${{ runner.tool_cache }}:${{runner.tool_cache}} --ulimit nofile=1048576:1048576
          script: |
            print_fd_usage() {
              local label="$1"

              echo "::group::fd usage (${label})"
              echo "process fd soft limit: $(ulimit -Sn)"
              echo "process fd hard limit: $(ulimit -Hn)"
              if [[ -r /proc/sys/fs/file-max ]]; then
                echo "system fd max: $(cat /proc/sys/fs/file-max)"
              fi
              if [[ -r /proc/sys/fs/file-nr ]]; then
                read -r system_fd_allocated system_fd_unused system_fd_max < /proc/sys/fs/file-nr
                echo "system fd allocated=${system_fd_allocated} unused=${system_fd_unused} max=${system_fd_max}"
              fi
              if [[ -d /proc/self/fd ]]; then
                echo "current process fd count: $(find /proc/self/fd -mindepth 1 -maxdepth 1 2>/dev/null | wc -l)"
              fi
              echo "::endgroup::"
            }

            export PATH=${{ steps.calculate-node-bin-path.outputs.path }}:$PATH
            export WASM=1
            pnpm run build:js
            print_fd_usage "before e2e-browser-test"
            set +e
            pnpm run test:e2e-browser
            e2e_browser_status=$?
            print_fd_usage "after e2e-browser-test"
            exit "$e2e_browser_status"
  test:
    runs-on: ${{ fromJSON(inputs.runner) }}
    timeout-minutes: 60
    strategy:
      fail-fast: false # wait for all test to finish for determining if it's node version based problem or general problem
      matrix:
        node: ${{ fromJSON(
          inputs.target == 'wasm32-wasip1-threads'&& '[24]'
          || contains(inputs.target, 'linux') && '[20, 24]'
          || '[22]') }}
    name: Test Node ${{ matrix.node }}
    defaults:
      run:
        shell: bash
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: true
      PUPPETEER_SKIP_DOWNLOAD: true
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ inputs.ref }}
          clean: ${{ runner.environment == 'github-hosted' }}

      - name: Disable CPU hogs (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        continue-on-error: true
        run: |
          $ErrorActionPreference = 'SilentlyContinue'
          Set-MpPreference -DisableRealtimeMonitoring $true -Force
          Add-MpPreference -ExclusionPath "C:\" -Force
          Add-MpPreference -ExclusionPath "D:\" -Force
          sc.exe config wuauserv start= disabled
          Stop-Service wuauserv
          reg add "HKLM\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Image File Execution Options\wsl.exe" /v Debugger /t REG_SZ /d "block.exe" /f
          reg add "HKLM\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Image File Execution Options\CompatTelRunner.exe" /v Debugger /t REG_SZ /d "block.exe" /f

      - name: Download bindings
        uses: ./.github/actions/artifact/download
        with:
          name: bindings-${{ inputs.target }}
          path: crates/node_binding/

      - name: Show restored binding
        run: ls -lah crates/node_binding/

      - name: Setup Pnpm
        timeout-minutes: 5
        uses: ./.github/actions/pnpm/setup
        with:
          node-version: ${{ matrix.node }}

      - name: Pnpm Install
        run: pnpm i

      ### x86_64-unknown-linux-gnu
      - name: Test x86_64-unknown-linux-gnu
        timeout-minutes: 15 # Tests should finish within 15 mins, please fix your tests instead of changing this to a higher timeout.
        if: ${{ inputs.target == 'x86_64-unknown-linux-gnu' }}
        run: pnpm run test:ci

      - name: Upload linux test cache
        if: ${{ inputs.target == 'x86_64-unknown-linux-gnu' && matrix.node == '24' }}
        uses: ./.github/actions/artifact/upload
        with:
          name: testCase-persistentCache-linux
          path: tests/rspack-test/js/temp/**/.cache
          include-hidden-files: true

      ### *-apple-darwin
      - name: Test apple-darwin
        timeout-minutes: 20 # Tests should finish within 15 mins, please fix your tests instead of changing this to a higher timeout.
        if: ${{ contains(inputs.target, 'apple-darwin') }}
        run: |
          # arch is ARM and target is ARM
          if [[ '${{ runner.arch }}' == ARM* && '${{ inputs.target }}' == 'aarch64-apple-darwin' ]]; then
            pnpm run test:ci
          fi
          # arch is x64 and target is x64
          if [[ '${{ runner.arch }}' != ARM* && '${{ inputs.target }}' != 'aarch64-apple-darwin' ]]; then
            pnpm run test:ci
          fi

      ### x86_64-pc-windows-msvc
      - name: Test x86_64-pc-windows-msvc
        timeout-minutes: 10
        if: ${{ inputs.target == 'x86_64-pc-windows-msvc' }}
        run: pnpm run test:ci

      - name: Upload windows test cache
        if: ${{ inputs.target == 'x86_64-pc-windows-msvc' && matrix.node == '22' }}
        uses: ./.github/actions/artifact/upload
        with:
          name: testCase-persistentCache-windows
          path: tests/rspack-test/js/temp/**/.cache
          include-hidden-files: true

      ### WASM
      - name: Test WASM
        timeout-minutes: 15 # Tests should finish within 15 mins, please fix your tests instead of changing this to a higher timeout.
        if: ${{ inputs.target == 'wasm32-wasip1-threads' }}
        env:
          NODE_NO_WARNINGS: 1
          WASM: 1
          RSPACK_LOADER_WORKER_THREADS: 1
        run: pnpm run test:ci

      - name: Upload Test Reporter
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rstest-event-reports-${{ inputs.target }}-node${{ matrix.node }}
          path: '*-report.txt'
          if-no-files-found: ignore
