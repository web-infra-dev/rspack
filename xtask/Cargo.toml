[package]
authors.workspace       = true
categories.workspace    = true
description             = "cargo extension workflow to manage rspack tasks"
documentation.workspace = true
edition.workspace       = true
license.workspace       = true
name                    = "xtask"
publish                 = false
repository.workspace    = true
version                 = "0.103.4"

[dependencies]
anyhow     = { workspace = true }
cargo_toml = { workspace = true }
clap       = { workspace = true, features = ["color", "error-context", "help", "std", "suggestions", "usage", "derive"] }
serde_json = { workspace = true }

[lints]
workspace = true

[package.metadata.cargo-shear]
# Owned by rspack_benchmark and linked from its walltime bench via #[path].
ignored-paths = ["benchmark/benches/groups/bundle/threejs_10x.rs"]
