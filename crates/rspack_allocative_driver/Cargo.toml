[package]
description          = "Compiler driver for Rspack allocative instrumentation"
edition.workspace    = true
license.workspace    = true
name                 = "rspack_allocative_driver"
repository.workspace = true
version.workspace    = true

[lib]
doctest = false
test    = false

[features]
default = []
driver  = []

[[bin]]
name              = "rspack-allocative-driver"
path              = "src/main.rs"
required-features = ["driver"]
test              = false

[dependencies]
proc-macro2 = { workspace = true, features = ["span-locations"] }
quote       = { workspace = true }
rustc-hash  = { workspace = true, features = ["std"] }
syn         = { workspace = true, features = ["full", "visit", "parsing", "printing", "clone-impls"] }

[lints]
workspace = true
