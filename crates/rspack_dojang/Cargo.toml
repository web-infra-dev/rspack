[package]
authors.workspace       = true
categories.workspace    = true
description             = "EJS-like HTML template engine for Rspack"
documentation.workspace = true
edition.workspace       = true
homepage.workspace      = true
license.workspace       = true
name                    = "rspack_dojang"
repository.workspace    = true
version.workspace       = true

[features]
allocative = ["dep:rspack_allocative"]

[dependencies]
html-escape       = { workspace = true }
rspack_allocative = { workspace = true, optional = true }
rustc-hash        = { workspace = true, features = ["std"] }
serde_json        = { workspace = true }

[lints]
workspace = true

[lib]
doctest = false

[package.metadata.cargo-shear]
# The allocative compiler driver injects enum derives that use this dependency.
ignored = ["rspack_allocative"]
