[package]
description       = "rspack dynamic wasm runtime"
edition.workspace = true
license           = "MIT"
name              = "rspack_wasm_runtime"
publish           = false
repository        = "https://github.com/web-infra-dev/rspack"
version.workspace = true

[lib]
crate-type = ["cdylib"]
test       = false

[dependencies]
anyhow      = { workspace = true }
once_cell   = { workspace = true }
wasi-common = { workspace = true, features = ["sync", "wasmtime"] }
wasmtime    = { workspace = true, features = ["runtime", "cranelift"] }

[lints]
workspace = true
