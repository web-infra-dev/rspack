[package]
description       = "Rspack's mimalloc allocation adapter"
edition.workspace = true
license           = "MIT"
name              = "rspack_mimalloc"
repository        = "https://github.com/web-infra-dev/rspack"
version.workspace = true

[target.'cfg(not(target_family = "wasm"))'.dependencies]
libmimalloc-sys = { workspace = true }

[target.'cfg(target_os = "linux")'.dependencies]
# Keep the TLS model used by the Node binding.
mimalloc = { workspace = true, features = ["local_dynamic_tls", "v3"] }

[target.'cfg(all(not(target_os = "linux"), not(target_family = "wasm")))'.dependencies]
mimalloc = { workspace = true, features = ["v3"] }

[lints]
workspace = true

[lib]
doctest = false
test    = false
