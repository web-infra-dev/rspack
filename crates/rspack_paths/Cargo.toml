[package]
description       = "rspack paths"
edition.workspace = true
license           = "MIT"
name              = "rspack_paths"
repository        = "https://github.com/web-infra-dev/rspack"
version.workspace = true

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

# `rspack_cacheable` is optional because it pulls in swc_core and lightningcss, which
# `rspack_resolver` cannot afford: it has to keep building for wasm32-unknown-unknown.
[features]
allocative = ["rspack_intern/allocative"]
cacheable  = ["dep:rspack_cacheable", "dep:smallvec", "dep:memchr"]
default    = ["cacheable"]

[dependencies]
camino           = { workspace = true }
dashmap          = { workspace = true, features = ["raw-api"] }
indexmap         = { workspace = true }
memchr           = { workspace = true, optional = true }
rspack_cacheable = { workspace = true, optional = true }
rspack_intern    = { workspace = true }
rustc-hash       = { workspace = true }
smallvec         = { workspace = true, optional = true }
ustr             = { workspace = true }

[lints]
workspace = true

[lib]
doctest = false
test    = false
