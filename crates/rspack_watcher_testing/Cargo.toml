[package]
description          = "Rspack watcher lifecycle tests"
edition.workspace    = true
license.workspace    = true
name                 = "rspack_watcher_testing"
publish              = false
repository.workspace = true
version.workspace    = true

[package.metadata.cargo-shear]
# Used by the watcher implementation compiled through include! in src/lib.rs.
ignored = ["cow-utils", "dashmap", "regex", "rspack_regex", "tracing"]

[dev-dependencies]
cow-utils    = { workspace = true }
dashmap      = { workspace = true }
futures      = { workspace = true }
notify       = { workspace = true, features = ["macos_fsevent"] }
regex        = { workspace = true }
rspack_error = { workspace = true }
rspack_paths = { workspace = true }
rspack_regex = { workspace = true }
rspack_util  = { workspace = true }
tempfile     = { workspace = true }
tokio        = { workspace = true, features = ["rt-multi-thread", "macros", "sync", "time", "fs"] }
tracing      = { workspace = true }

[lints]
workspace = true

[lib]
doctest = false
