[package]
authors.workspace       = true
categories.workspace    = true
description             = "Rusty webpack-sources port."
documentation.workspace = true
edition.workspace       = true
homepage.workspace      = true
keywords                = ["sources", "sourcemap"]
license.workspace       = true
name                    = "rspack_sources"
readme                  = "README.md"
repository.workspace    = true
version.workspace       = true

[features]
allocative       = ["dep:rspack-allocative"]
codspeed         = []
rspack_cacheable = ["dep:rkyv"]

[dependencies]
memchr            = { workspace = true, features = ["std"] }
rkyv              = { workspace = true, optional = true }
rspack-allocative = { workspace = true, optional = true }
rustc-hash        = { workspace = true, features = ["std"] }
serde             = { workspace = true, features = ["rc", "std"] }
simd-json         = { workspace = true, features = ["runtime-detection", "serde_impl", "swar-number-parsing"] }
simd-utf16-len    = { workspace = true }
static_assertions = { workspace = true }
xxhash-rust       = { workspace = true, features = ["xxh3"] }

# Native bindings use the host Node.js zlib. Standalone Rust builds use libz-sys discovery.
[target.'cfg(not(target_family = "wasm"))'.dependencies]
flate2 = { workspace = true, features = ["zlib"] }

# WASM cannot resolve symbols from the native Node.js executable.
[target.'cfg(target_family = "wasm")'.dependencies]
flate2 = { workspace = true, features = ["rust_backend"] }

[dev-dependencies]
regex     = { workspace = true }
twox-hash = { workspace = true, features = ["xxhash64"] }

[lints]
workspace = true
