[package]
description       = "rspack location"
edition.workspace = true
license           = "MIT"
name              = "rspack_location"
repository        = "https://github.com/web-infra-dev/rspack"
version.workspace = true

[features]
allocative = ["dep:rspack-allocative"]

[dependencies]
itoa              = { workspace = true }
memchr            = { workspace = true }
rspack-allocative = { workspace = true, optional = true }
rspack_cacheable  = { workspace = true }

[lints]
workspace = true

[lib]
doctest = false

[package.metadata.cargo-shear]
# The allocative compiler driver injects enum derives that use this dependency.
ignored = ["rspack-allocative"]
