packages:
  - 'packages/*'
  - 'examples/*'
  - 'scripts'
  - 'website'
  - 'tests/e2e/fixtures/**'
  - 'npm/*'
  - 'crates/node_binding'
  - 'crates/rspack_binding_builder_testing'
  - 'tests/e2e'
  - 'tests/e2e-browser'
  - 'tests/rspack-test'
  - 'tests/type-tests'
  - 'tests/bench'
  # this following is used to test resolve in monorepo
  - 'tests/rspack-test/normalCases/resolve/pnpm-workspace/packages/*'

dedupePeers: true

hoistPattern:
  - '!buffer'

preferSymlinkedExecutables: true

patchedDependencies:
  webpack-sources@3.3.4: patches/webpack-sources@3.3.4.patch

allowBuilds:
  '@parcel/watcher': true
  '@swc/core': true
  core-js: false
  es5-ext: false
  esbuild: true

minimumReleaseAgeExclude:
  - '@rspack/*'
  - '@rsbuild/*'
  - '@rslib/*'
  - '@rspress/*'
  - '@rstest/*'
  - '@rsdoctor/*'
  - '@rslint/*'
