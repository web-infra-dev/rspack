  tailwindcss3:
    'tailwindcss': '^3.4.19'
  typescript7:
    'typescript': '^7.0.2'

allowBuilds:
  '@parcel/watcher': false
  core-js: false
  'es5-ext': false
  'esbuild': true

dedupePeers: true

autoInstallPeers: false

peerDependencyRules:
  ignoreMissing:
    - webpack
    - '@algolia/client-search'
    - algoliasearch
    - search-insights

# Reduce the risk of installing compromised packages
minimumReleaseAge: 1440
minimumReleaseAgeExclude:
  - '@rspack/*'
  - '@rsbuild/*'
  - '@rslib/*'
  - '@rspress/*'
  - '@rstest/*'
  - '@rsdoctor/*'
  - '@rslint/*'
  - '@rstack-dev/doc-ui'
  - 'rsbuild-plugin-*'
  - 'rstack'
  - '@swc/*'
  - 'heading-case'
  - '@rstackjs/*'
  # Renovate security update: mermaid@11.16.1
  - mermaid@11.16.1

patchedDependencies:
  webpack-sources@3.5.1: patches/webpack-sources@3.5.1.patch

# Prevent un-reviewed build scripts
strictDepBuilds: true
